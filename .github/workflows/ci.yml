name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Note: `cargo fmt --all --check` is intentionally omitted: the repo has
      # pre-existing formatting drift (e.g. api/src/client.rs, kiro_wire.rs);
      # re-enabling it requires a formatting-only commit first.
      - name: Clippy
        run: |
          set +e
          cargo clippy --workspace --all-targets --color=never --message-format=short > /tmp/clippy.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep 'error' /tmp/clippy.log | head -10 | sed 's|^|::error::|' || true
            exit "$status"
          fi

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: |
          set +e
          cargo test --workspace --color=never > /tmp/test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E 'FAILED|^failures:|^test .* FAILED' /tmp/test.log | head -10 | sed 's|^|::error::|' || true
            exit "$status"
          fi
