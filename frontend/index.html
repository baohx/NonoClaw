        color: var(--amber);
        margin-bottom: 6px;
      }
      .dialog__eyebrow.mint { color: var(--accent); }
      .dialog__eyebrow.coral { color: #ff6b6b; }
      .dialog__title {
        font-family: var(--font-display);
        font-weight: 700;
        letter-spacing: -0.022em;
        font-size: 23px;
        line-height: 1.15;
        color: var(--text);
        margin-bottom: 4px;
      }
      .dialog__sub { font-family: var(--font-mono); font-size: 12px; color: var(--accent); margin-bottom: 12px; }
      .dialog__body { color: var(--text); font-size: 14px; line-height: 1.6; letter-spacing: 0; }
      .dialog__pre {
        margin: 12px 0;
        padding: 12px 14px;
        background: rgba(0, 0, 0, 0.035);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.55;
        color: var(--muted);
        max-height: 200px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      [data-color-scheme="dark"] .dialog__pre { background: rgba(0, 0, 0, 0.25); }
      .dialog__actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
      .btn {
        appearance: none;
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
        padding: 8px 18px;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.12s, background 0.15s, opacity 0.15s;
      }
      .btn:active { transform: scale(0.96); }
      .btn--primary {
        background: var(--accent);
        color: #ffffff;
        border: none;
        box-shadow: var(--shadow-sm);
      }
      .btn--primary:hover { background: var(--accent-hover); }
      .btn--ghost {
        background: rgba(0, 0, 0, 0.05);
        border: none;
        color: var(--text);
      }
      [data-color-scheme="dark"] .btn--ghost { background: rgba(255, 255, 255, 0.09); }
      .btn--ghost:hover { background: var(--accent-soft); color: var(--accent); }
      .btn--danger {
        background: rgba(255, 69, 58, 0.12);
        border: none;
        color: var(--rose);
      }
      .btn--danger:hover { background: rgba(255, 69, 58, 0.2); }
      .btn[disabled] { opacity: 0.4; cursor: not-allowed; }

      /* Session picker */
      .sp-row {
        text-align: left;
        width: 100%;
        padding: 12px 14px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.55);
        cursor: pointer;
        color: var(--text);
        transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      }
      [data-color-scheme="dark"] .sp-row { background: rgba(255, 255, 255, 0.05); }
      .sp-row:hover { border-color: var(--accent-strong); box-shadow: var(--shadow-sm); }
      .sp-row.active { border-color: var(--accent-strong); background: var(--accent-softer); }
      .sp-row__top { display: flex; gap: 9px; align-items: center; margin-bottom: 3px; font-family: var(--font-mono); font-size: 11px; }
      .sp-row__date { color: var(--accent); }
      .sp-row__count { color: var(--faint); }
      .sp-tag { color: var(--accent); border: 1px solid var(--accent-strong); border-radius: 5px; padding: 0 5px; font-size: 9.5px; }
      .sp-row__sum { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0; }
      .sp-new {
        width: 100%; padding: 11px; margin-bottom: 12px;
        border-radius: var(--radius-md); cursor: pointer;
        border: 1px solid var(--accent-strong);
        background: var(--accent-softer);
        color: var(--accent); font-weight: 600; font-size: 13px;
        font-family: var(--font-sans); letter-spacing: -0.01em;
        transition: background 0.15s;
      }
      .sp-new:hover { background: var(--accent-soft); }

      .sp-list {
        display: flex; flex-direction: column; gap: 7px; margin-top: 4px;
        max-height: calc(5 * 74px + 4 * 7px); overflow-y: auto;
      }

      .q-opt {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 13px; margin: 5px 0;
        border: 1px solid var(--border); border-radius: var(--radius-md);
        cursor: pointer; font-size: 14px; color: var(--text); letter-spacing: -0.011em;
        transition: border-color 0.15s, background 0.15s;
      }
      .q-opt:hover { border-color: var(--accent-strong); background: var(--accent-softer); }
      .q-opt input { accent-color: var(--accent); }
      .dialog__textarea {
        width: 100%; box-sizing: border-box;
        font-family: var(--font-mono); font-size: 13px;
        padding: 10px 12px; border-radius: 8px;
        border: 1px solid var(--border);
        background: rgba(0,0,0,0.03); color: var(--text);
        resize: vertical; outline: none;
      }
      .dialog__textarea:focus { border-color: var(--accent); }

      /* ── Mobile ─────────────────────────────────────────────────────────── */
      @media (max-width: 680px) {
        :root { --rail-w: 0px; --insight-w: 0px; }
        .rail, .insight { display: none; }
        .app-body { grid-template-columns: 0px 1fr 0px !important; }
        .app-root { position: relative; }
        .stage { width: 100vw !important; min-width: 100vw !important; max-width: 100vw !important; }

        .statusbar { padding: 0 8px; min-height: 44px; }
        .statusbar__model, .statusbar__divider, .statusbar__tokens,
        .tag-compact, .session-pill, .breath-status { display: none; }
        .statusbar__brand { font-size: 15px; }
        .statusbar__side { gap: 5px; }
        .mode-select { font-size: 10px; padding: 2px 7px; height: 24px; }

        .chat-scroll { padding: 10px 10px 90px; }

        .welcome { padding: 6vh 10px 16px; }
        .welcome__mark { font-size: 38px; margin-bottom: 8px; }
        .welcome__sub { font-size: 13px; }
        .welcome__hint { font-size: 10.5px; margin-top: 8px; }

        .msg { margin-bottom: 14px; }
        .msg__role { font-size: 9.5px; margin-bottom: 5px; gap: 5px; }
        .msg--user .msg__bubble { max-width: 92%; padding: 9px 13px; border-radius: 17px 17px 5px 17px; }
        .msg--assistant .msg__bubble { font-size: 14px; line-height: 1.6; }
        .msg--system .msg__line { font-size: 10px; padding: 3px 9px; }

        .toolcard { margin: 7px 0; border-radius: var(--radius-sm); }
        .toolcard__head { padding: 7px 11px; font-size: 11.5px; }
        .toolcard__cmd { max-width: 180px; font-size: 10px; }
        .toolcard__pre { margin: 0 9px 9px; padding: 9px 11px; font-size: 11px; max-height: 200px; }
        .subagents { margin: 3px 6px 8px 8px; gap: 6px; }
        .subagent__head { gap: 5px; padding: 7px 8px; }
        .subagent__body { padding: 0 4px 7px 7px; }
        .subagent__profile { max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .subagent__status { font-size: 8.5px; }
        .subtool__permission { display: none; }

        .markdown-body { font-size: 14px; line-height: 1.6; }
        .markdown-body h1 { font-size: 1.4em; }
        .markdown-body h2 { font-size: 1.2em; }
        .markdown-body pre { font-size: 11.5px; padding: 10px 12px; }
        .stream-plain { font-size: 14px; line-height: 1.6; }

        .composer {
          position: sticky; bottom: 0; z-index: 10;
          padding: 5px 7px max(14px, env(safe-area-inset-bottom));
          background: linear-gradient(0deg, var(--bg) 40%, transparent);
        }
        .composer__shell { border-radius: var(--radius-lg); }
        .composer__textarea { font-size: 16px; padding: 11px 13px 2px; min-height: 20px; }
        .composer__hint { align-items: flex-end; font-size: 9.5px; padding: 2px 9px 9px 13px; }
        .composer__hint-main { gap: 5px; }
        .composer__shortcut-key { display: none; }
        .composer__run-options {
          gap: 5px;
          margin-left: 0;
          padding-left: 0;
          border-left: 0;
        }
        .composer__run-options label > span { display: none; }
        .composer__run-options select { max-width: 122px; height: 24px; font-size: 9.5px; }
        .composer__run-options label:last-of-type select { max-width: 104px; }
        .composer__send { flex: 0 0 auto; padding: 8px 17px; font-size: 13px; }

        .iconbtn { min-width: 44px; min-height: 44px; font-size: 14px; border-radius: 10px; }
        .theme-dot { width: 20px; height: 20px; }
        .tree-row { padding-top: 8px; padding-bottom: 8px; font-size: 12px; min-height: 38px; }
        .insight-row { padding: 9px 8px; font-size: 12px; }
        .acc-head { padding: 10px 8px; font-size: 10.5px; }

        .dialog { max-width: 94% !important; padding: 20px 18px 16px; border-radius: var(--radius-lg); }
        .dialog__title { font-size: 20px; }

        .connect-overlay { gap: 14px; }
        .connect-orb { width: 32px; height: 32px; }

        .statusbar__side > .iconbtn { display: none; }
        .composer__textarea { width: 100%; box-sizing: border-box; }
        .msg-action[title*="Export"] { display: none; }
      }

      @media (orientation: landscape) and (max-height: 700px) {
        :root { --rail-w: 0px; --insight-w: 0px; }
        .rail, .insight, .statusbar__side > .iconbtn { display: none; }
        .app-body { grid-template-columns: 0px 1fr 0px !important; }
        .stage { width: 100vw !important; }
      }

      /* ── Mermaid + SVG diagrams ────────────────────────────────────────── */
      .mermaid-container {
        margin: 14px 0;
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .mermaid-container svg {
        width: 100% !important;
        max-width: 100%;
        height: auto !important;
      }
      .mermaid-raw { white-space: pre-wrap; font-size: 12px; color: var(--muted); }
      .svg-container {
        margin: 14px 0;
        display: flex;
        justify-content: center;
        padding: 14px;
        background: var(--glass-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
      }
      .svg-container svg { max-width: 100%; height: auto; }
      @media (prefers-reduced-motion: reduce) {
        .breath-dot, .connect-orb, .stream-caret, .toolcard__status.run {
          animation: none;
        }
        .app-body, .chat-refresh, .theme-dot, .composer__send {
          transition-duration: 0.01ms;
        }
      }
      .download-target { position: fixed; width: 0; height: 0; border: 0; visibility: hidden; }
      .filetree-menu { position: fixed; z-index: 1000; min-width: 132px; max-width: 220px; padding: 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--glass-2); box-shadow: 0 8px 24px rgba(0,0,0,.20); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); }
      .filetree-menu button { width: 100%; padding: 7px 9px; border: 0; border-radius: 5px; text-align: left; background: transparent; color: var(--text); }
      .filetree-menu button:not(:disabled):hover, .filetree-menu button:focus-visible { background: var(--surface-hover); outline: 2px solid var(--accent-strong); }
      .filetree-menu button:disabled { opacity: .45; cursor: not-allowed; }
      .filetree-menu__hint { padding: 5px 9px 3px; color: var(--text-muted); font-size: 11px; }
      .msg-export-options { display: inline-flex; gap: 3px; margin-left: 3px; }
      .msg-export-options button { border: 1px solid var(--border); border-radius: 4px; padding: 2px 5px; background: var(--surface); color: var(--text-muted); font-size: 10px; cursor: pointer; }
      .toolcard__details { display: grid; gap: 6px; padding: 8px 12px 12px; }
      .toolcard__details strong { color: var(--text-muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
      .echarts-block { margin: 12px 0; overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
      .echarts-block figcaption { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 11px; }
      .echarts-block figcaption button { border: 1px solid var(--border); border-radius: 4px; background: transparent; color: inherit; cursor: pointer; }
      .echarts-block details { padding: 6px 10px 10px; border-top: 1px solid var(--border); }
      .echarts-block details pre { max-height: 240px; overflow: auto; }

      /* ===== F1 状态宠物（BreathController 驱动的像素猫爪） ===== */
      .pet-corner { position: fixed; right: 18px; bottom: 18px; z-index: 40; pointer-events: none;
        opacity: .92; transition: transform .25s ease; }
      .pet-corner:hover { transform: scale(1.12); }
      .pet-svg { filter: drop-shadow(0 2px 6px rgba(0,0,0,.18)); }
      .pet-zzz-1 { animation: pet-zzz 1.6s ease-in-out infinite; }
      .pet-zzz-2 { animation: pet-zzz 1.6s ease-in-out .4s infinite; }
      @keyframes pet-zzz { 0%,100% { opacity: .2; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-1.5px); } }
      .pet-yarn-paw { animation: pet-pawbat .5s ease-in-out infinite; transform-origin: 11px 12px; }
      .pet-yarn-ball { animation: pet-ballroll .9s linear infinite; transform-origin: 18px 16px; }
      @keyframes pet-pawbat { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
      @keyframes pet-ballroll { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .pet-raise { animation: pet-wave 1.2s ease-in-out infinite; transform-origin: 17px 9px; }
      @keyframes pet-wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-18deg); } }
      .pet-blow-body { animation: pet-shake .3s linear infinite; transform-origin: 11px 12px; }
      .pet-spike { animation: pet-spiketwitch .5s ease-in-out infinite; }
      @keyframes pet-shake { 0%,100% { transform: translateX(-.5px); } 50% { transform: translateX(.5px); } }
      @keyframes pet-spiketwitch { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      .pet-jump { animation: pet-hop .55s ease-in-out infinite; transform-origin: 11px 22px; }
      @keyframes pet-hop { 0%,100% { transform: translateY(0) scaleY(1); } 40% { transform: translateY(-2.5px) scaleY(1.04); } 60% { transform: translateY(0) scaleY(.96); } }
      @media (prefers-reduced-motion: reduce) {
        .pet-corner *, .pet-corner { animation: none !important; }
      }

      /* ===== F2 Context X-Ray ===== */
      .xray-root { display: flex; flex-direction: column; gap: 10px; }
      .xray-empty { padding: 14px 10px; color: var(--text-muted); font-size: 11px; line-height: 1.6; }
      .xray-total { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-muted); }
      .xray-total__legend { display: inline-flex; gap: 8px; }
      .xray-total__legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 3px; vertical-align: -1px; }
      .xray-stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
      .xray-stack__seg { display: block; min-width: 2px; }
      .xray-section { display: flex; flex-direction: column; gap: 3px; }
      .xray-section__head { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 4px 0 2px; }
      .xray-section__head strong { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); }
      .xray-section__dot { width: 8px; height: 8px; border-radius: 50%; }
      .xray-section__sum { margin-left: auto; color: var(--text-muted); font-size: 10px; }
      .xray-row { display: grid; grid-template-columns: minmax(70px, 38%) 1fr 42px; gap: 6px; align-items: center; font-size: 10px; }
      .xray-row__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
      .xray-row__bar { height: 8px; background: var(--surface-hover, rgba(127,127,127,.12)); border-radius: 4px; overflow: hidden; }
      .xray-row__fill { display: block; height: 100%; border-radius: 4px; transition: width .3s ease; }
      .xray-row__val { text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; }
      .xray-doctor { border: 1px solid #ffd60a66; background: #ffd60a14; border-radius: 6px; padding: 8px 10px; font-size: 11px; display: flex; flex-direction: column; gap: 3px; }
      .xray-doctor strong { font-size: 10px; letter-spacing: .04em; }
      .xray-doctor__item { color: var(--text-muted); }

      /* ===== F4 Trajectory Replay ===== */
      .traj-root { display: flex; flex-direction: column; gap: 8px; }
      .traj-empty { padding: 14px 10px; color: var(--text-muted); font-size: 11px; }
      .traj-lineage { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 10px;
        border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; background: var(--surface); }
      .traj-lineage strong { font-size: 10px; letter-spacing: .04em; }
      .traj-lineage__hop { color: var(--text-muted); }
      .traj-lineage__cur { color: var(--accent, #0071e3); }
      .traj-axis { display: flex; flex-wrap: wrap; gap: 3px; padding: 4px 0; max-height: 120px; overflow: auto; }
      .traj-node { border: 0; background: transparent; padding: 2px; cursor: pointer; border-radius: 4px; }
      .traj-node:hover { background: var(--surface-hover, rgba(127,127,127,.14)); }
      .traj-node__dot { display: block; width: 9px; height: 9px; border-radius: 50%; }
      .traj-node--user .traj-node__dot { border-radius: 2px; }
      .traj-legend { display: flex; gap: 8px; font-size: 10px; color: var(--text-muted); align-items: center; }
      .traj-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; vertical-align: -1px; }
      .traj-legend__hint { margin-left: auto; opacity: .7; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script>
      (function () {
        function mermaidTheme() {
          return document.documentElement.getAttribute("data-color-scheme") === "dark"
            ? "dark"
            : "neutral";
        }
        function initMermaid() {
          if (window.mermaid) {
            window.mermaid.initialize({
              startOnLoad: false,
              theme: mermaidTheme(),
              securityLevel: "loose",
            });
          }
        }
        initMermaid();
        new MutationObserver(initMermaid).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["data-theme", "data-color-scheme"],
        });
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
