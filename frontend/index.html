      .gov-node--subagent { color: var(--accent); }
      .gov-node--flagged { background: rgba(255, 69, 58, 0.08); }
      .gov-node__chevron { width: 12px; color: var(--faint); flex: 0 0 auto; }
      .gov-node__pip { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: 0 0 auto; }
      .gov-node__pip--ok { background: var(--green); }
      .gov-node__pip--fail { background: var(--rose); }
      .gov-node__label { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .gov-node__meta { color: var(--faint); font-size: 11px; flex: 0 0 auto; }
      .gov-node__status { color: var(--amber); font-size: 10.5px; flex: 0 0 auto; }
      .gov-node__flag { color: var(--rose); flex: 0 0 auto; }
      .gov-node__children { border-left: 1px solid var(--border); margin-left: 12px; }
      .gov-list { display: flex; flex-direction: column; gap: 10px; }
      .gov-anomaly, .gov-alert {
        border: 1px solid var(--border); border-radius: var(--radius-md);
        background: rgba(255, 255, 255, 0.5); padding: 12px 14px;
      }
      [data-color-scheme="dark"] .gov-anomaly, [data-color-scheme="dark"] .gov-alert { background: rgba(255, 255, 255, 0.05); }
      .gov-anomaly__head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .gov-anomaly__icon { font-size: 15px; }
      .gov-anomaly__type { font-weight: 700; font-size: 13px; color: var(--text); }
      .gov-anomaly__confidence {
        font-family: var(--font-mono); font-size: 11px; color: var(--rose);
        background: rgba(255, 69, 58, 0.1); padding: 1px 7px; border-radius: 999px;
      }
      .gov-anomaly__spacer { flex: 1; }
      .gov-anomaly__cost { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
      .gov-anomaly__desc { font-size: 13px; color: var(--text); line-height: 1.5; }
      .gov-anomaly__suggestion, .gov-alert__suggestion { font-size: 12.5px; color: var(--accent); margin-top: 6px; line-height: 1.5; }
      .gov-anomaly__nodes { font-size: 11px; color: var(--faint); margin-top: 6px; font-family: var(--font-mono); }
      .gov-alert--critical { border-color: rgba(255, 69, 58, 0.35); }
      .gov-alert--warning { border-color: rgba(255, 159, 10, 0.35); }
      .gov-alert__title { font-weight: 700; font-size: 13px; color: var(--text); margin-bottom: 4px; }
      .gov-alert__body { font-size: 13px; color: var(--muted); line-height: 1.5; }

      /* Trajectory ledger (DSH ui-trajectory port) */
      .thinking { margin: 0 0 8px; border: 1px solid var(--border); border-radius: var(--radius-md); background: rgba(127, 127, 127, 0.07); }
      .thinking__summary {
        cursor: pointer; font-size: 11px; color: var(--faint); padding: 4px 10px;
        display: flex; align-items: center; gap: 8px; user-select: none; list-style: none;
      }
      .thinking__summary::-webkit-details-marker { display: none; }
      .thinking__summary::before { content: "▸"; transition: transform 0.15s; font-size: 9px; }
      .thinking[open] .thinking__summary::before { transform: rotate(90deg); }
      .thinking__len { font-family: var(--font-mono); font-size: 10px; opacity: 0.7; }
      .thinking__body {
        margin: 0; padding: 8px 10px; font-family: var(--font-mono); font-size: 11.5px;
        white-space: pre-wrap; word-break: break-word; color: var(--muted);
        max-height: 260px; overflow: auto; border-top: 1px solid var(--border);
      }
      .ledger { display: flex; flex-direction: column; gap: 8px; min-height: 0; height: 100%; }
      .ledger-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .ledger-toolbar__title { font-weight: 700; font-size: 13px; }
      .ledger-toolbar__stats { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
      .ledger-search { flex: 0 1 180px; }
      .ledger-modes { display: flex; gap: 4px; margin-left: auto; }
      .ledger-mode {
        font-size: 11px; padding: 3px 8px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--border); background: transparent; color: var(--muted);
      }
      .ledger-mode--active { border-color: var(--accent-strong); color: var(--accent); background: var(--accent-soft); }
      .ledger-overview {
        position: relative; height: 80px; border: 1px solid var(--border); border-radius: var(--radius-md);
        background: rgba(127, 127, 127, 0.06); overflow: hidden; user-select: none; cursor: crosshair;
      }
      .ledger-overview__empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--faint); font-size: 12px; }
      .ledger-overview__lanes { display: flex; flex-direction: column; height: 100%; }
      .ledger-overview__lane { position: relative; flex: 1; border-bottom: 1px solid var(--border); }
      .ledger-overview__lane:last-child { border-bottom: none; }
      .ledger-overview__lane-label { position: absolute; left: 4px; top: 4px; z-index: 2; font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; font-family: var(--font-mono); padding: 0 4px; border-radius: 3px; pointer-events: none; color: rgba(255,255,255,0.94); line-height: 14px; }
      .ledger-overview__lane-label--assistant { background: #34c759; }
      .ledger-overview__lane-label--thinking { background: #ff9f0a; }
      .ledger-overview__lane-label--tool { background: #af52de; }
      .ledger-overview__lane-label--user { background: #0a84ff; }
      .ledger-overview__lane-label--context { background: #8e8e93; }
      .ledger-overview__span { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; min-width: 2px; }
      /* Span colors mirror the event-table kind colors so a lane's tint always
         matches the same event's chip in the table below it. */
      .ledger-overview__span--assistant { background: rgba(52, 199, 89, 0.55); }
      .ledger-overview__span--thinking { background: rgba(255, 159, 10, 0.55); }
      .ledger-overview__span--tool { background: rgba(175, 82, 222, 0.55); }
      .ledger-overview__span--user { background: rgba(10, 132, 255, 0.55); }
      .ledger-overview__span--context { background: rgba(142, 142, 147, 0.55); }
      .ledger-overview__span--error { background: rgba(255, 69, 58, 0.75) !important; }
      .ledger-overview__idle { position: absolute; top: 0; bottom: 0; color: var(--faint); font-size: 10px; border-left: 1px dashed var(--border); }
      .ledger-overview__selection { position: absolute; top: 0; bottom: 0; background: rgba(10, 132, 255, 0.14); border-left: 1px solid var(--accent); border-right: 1px solid var(--accent); pointer-events: none; }
      .ledger-table { display: flex; flex-direction: column; min-height: 0; flex: 1; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
      .ledger-table__head { display: grid; grid-template-columns: 52px minmax(0, 1fr) 206px; border-bottom: 1px solid var(--border); background: rgba(127, 127, 127, 0.08); }
      .ledger-table__h { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); padding: 5px 8px; }
      .ledger-table__h--time { text-align: right; }
      .ledger-table__body { overflow-y: auto; min-height: 220px; }
      .ledger-turn-head { display: flex; align-items: center; gap: 8px; padding: 0 8px; font-size: 11.5px; font-weight: 700; color: var(--text); background: rgba(127, 127, 127, 0.09); }
      .ledger-turn-head--between { color: var(--muted); }
      .ledger-turn-head__toggle { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 10px; padding: 0; width: 14px; }
      .ledger-turn-head__label { font-family: var(--font-mono); }
      .ledger-turn-head__meta { font-family: var(--font-mono); font-size: 10px; color: var(--muted); font-weight: 400; }
      .ledger-turn-head__meta--retry { color: #ff9f0a; }
      .ledger-divider { border-top: 2px solid rgba(127, 127, 127, 0.4); }
      .ledger-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) 206px; align-items: center; cursor: pointer; font-size: 12.5px; }
      .ledger-row:hover { background: var(--accent-soft); }
      .ledger-row--selected { background: var(--accent-softer); }
      .ledger-row--dim { opacity: 0.32; }
      .ledger-row--error .ledger-row__text { color: #ff453a; }
      .ledger-row--request-only { color: var(--faint); font-style: italic; }
      .ledger-row__index { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); padding-left: 8px; }
      .ledger-row__event { display: flex; align-items: center; gap: 7px; overflow: hidden; }
      .ledger-row__kind { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 4px; padding: 1px 4px; font-family: var(--font-mono); }
      .ledger-row__kind--user { background: rgba(10, 132, 255, 0.16); color: var(--accent); }
      .ledger-row__kind--assistant { background: rgba(52, 199, 89, 0.16); color: #34c759; }
      .ledger-row__kind--thinking { background: rgba(255, 159, 10, 0.16); color: #ff9f0a; }
      .ledger-row__kind--tool { background: rgba(175, 82, 222, 0.14); color: #af52de; }
      .ledger-row__kind--system { background: rgba(127, 127, 127, 0.18); color: var(--muted); }
      .ledger-row__kind--compacted { background: rgba(255, 159, 10, 0.16); color: #ff9f0a; }
      .ledger-row__text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
      .ledger-row__hit { color: #ff9f0a; font-size: 8px; }
      .ledger-row__time { text-align: right; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); padding-right: 8px; }
      .ledger-inspector { border-top: 1px solid var(--border); padding-top: 8px; max-height: 180px; overflow: auto; }
      .ledger-inspector__head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .ledger-inspector__title { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ledger-inspector__close { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; }
      .ledger-inspector__facts { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
      .ledger-fact { display: flex; gap: 5px; font-family: var(--font-mono); font-size: 11px; }
      .ledger-fact__label { color: var(--faint); }
      .ledger-fact__value { color: var(--text); }
      .ledger-inspector__section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); margin: 6px 0 3px; }
      .ledger-inspector__code {
        font-family: var(--font-mono); font-size: 11px; white-space: pre-wrap; word-break: break-word;
        color: var(--text); background: rgba(127, 127, 127, 0.07); border-radius: 6px; padding: 6px 8px;
        max-height: 90px; overflow: auto; margin: 0;
      }
      .ledger-footnote { font-size: 10.5px; color: var(--faint); text-align: center; }


      /* Session picker */
      .sp-row {
        text-align: left;
        width: 100%;
        padding: 12px 14px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.55);
        cursor: pointer;
        color: var(--text);
        transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      }
      [data-color-scheme="dark"] .sp-row { background: rgba(255, 255, 255, 0.05); }
      .sp-row:hover { border-color: var(--accent-strong); box-shadow: var(--shadow-sm); }
      .sp-row.active { border-color: var(--accent-strong); background: var(--accent-softer); }
      .sp-row__top { display: flex; gap: 9px; align-items: center; margin-bottom: 3px; font-family: var(--font-mono); font-size: 11px; }
      .sp-row__date { color: var(--accent); }
      .sp-row__count { color: var(--faint); }
      .sp-tag { color: var(--accent); border: 1px solid var(--accent-strong); border-radius: 5px; padding: 0 5px; font-size: 9.5px; }
      .sp-row__sum { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0; }
      .sp-new {
        width: 100%; padding: 11px; margin-bottom: 12px;
        border-radius: var(--radius-md); cursor: pointer;
        border: 1px solid var(--accent-strong);
        background: var(--accent-softer);
        color: var(--accent); font-weight: 600; font-size: 13px;
        font-family: var(--font-sans); letter-spacing: -0.01em;
        transition: background 0.15s;
      }
      .sp-new:hover { background: var(--accent-soft); }

      .sp-list {
        display: flex; flex-direction: column; gap: 7px; margin-top: 4px;
        max-height: calc(5 * 74px + 4 * 7px); overflow-y: auto;
      }

      .q-opt {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 13px; margin: 5px 0;
        border: 1px solid var(--border); border-radius: var(--radius-md);
        cursor: pointer; font-size: 14px; color: var(--text); letter-spacing: -0.011em;
        transition: border-color 0.15s, background 0.15s;
      }
      .q-opt:hover { border-color: var(--accent-strong); background: var(--accent-softer); }
      .q-opt input { accent-color: var(--accent); }
      .dialog__textarea {
        width: 100%; box-sizing: border-box;
        font-family: var(--font-mono); font-size: 13px;
        padding: 10px 12px; border-radius: 8px;
        border: 1px solid var(--border);
        background: rgba(0,0,0,0.03); color: var(--text);
        resize: vertical; outline: none;
      }
      .dialog__textarea:focus { border-color: var(--accent); }

      /* ── Mobile ─────────────────────────────────────────────────────────── */
      @media (max-width: 680px) {
        :root { --rail-w: 0px; --insight-w: 0px; }
        .rail, .insight { display: none; }
        .app-body { grid-template-columns: 0px 1fr 0px !important; }
        .app-root { position: relative; }
        .stage { width: 100vw !important; min-width: 100vw !important; max-width: 100vw !important; }

        .statusbar { padding: 0 8px; min-height: 44px; }
        .statusbar__model, .statusbar__divider, .statusbar__tokens,
        .tag-compact, .session-pill, .breath-status { display: none; }
        .statusbar__brand { font-size: 15px; }
        .statusbar__side { gap: 5px; }
        .mode-select { font-size: 10px; padding: 2px 7px; height: 24px; }

        .chat-scroll { padding: 10px 10px 90px; }

        .welcome { padding: 6vh 10px 16px; }
        .welcome__mark { font-size: 38px; margin-bottom: 8px; }
        .welcome__sub { font-size: 13px; }
        .welcome__hint { font-size: 10.5px; margin-top: 8px; }

        .msg { margin-bottom: 14px; }
        .msg__role { font-size: 9.5px; margin-bottom: 5px; gap: 5px; }
        .msg--user .msg__bubble { max-width: 92%; padding: 9px 13px; border-radius: 17px 17px 5px 17px; }
        .msg--assistant .msg__bubble { font-size: 14px; line-height: 1.6; }
        .msg--system .msg__line { font-size: 10px; padding: 3px 9px; }

        .toolcard { margin: 7px 0; border-radius: var(--radius-sm); }
        .toolcard__head { padding: 7px 11px; font-size: 11.5px; }
        .toolcard__cmd { max-width: 180px; font-size: 10px; }
        .toolcard__pre { margin: 0 9px 9px; padding: 9px 11px; font-size: 11px; max-height: 200px; }
        .subagents { margin: 3px 6px 8px 8px; gap: 6px; }
        .subagent__head { gap: 5px; padding: 7px 8px; }
        .subagent__body { padding: 0 4px 7px 7px; }
        .subagent__profile { max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .subagent__status { font-size: 8.5px; }
        .subtool__permission { display: none; }

        .markdown-body { font-size: 14px; line-height: 1.6; }
        .markdown-body h1 { font-size: 1.4em; }
        .markdown-body h2 { font-size: 1.2em; }
        .markdown-body pre { font-size: 11.5px; padding: 10px 12px; }
        .stream-plain { font-size: 14px; line-height: 1.6; }

        .composer {
          position: sticky; bottom: 0; z-index: 10;
          padding: 5px 7px max(14px, env(safe-area-inset-bottom));
          background: linear-gradient(0deg, var(--bg) 40%, transparent);
        }
        .composer__shell { border-radius: var(--radius-lg); }
        .composer__textarea { font-size: 16px; padding: 11px 13px 2px; min-height: 20px; }
        .composer__hint { align-items: flex-end; font-size: 9.5px; padding: 2px 9px 9px 13px; }
        .composer__hint-main { gap: 5px; }
        .composer__shortcut-key { display: none; }
        .composer__run-options {
          gap: 5px;
          margin-left: 0;
          padding-left: 0;
          border-left: 0;
        }
        .composer__run-options label > span { display: none; }
        .composer__run-options select { max-width: 122px; height: 24px; font-size: 9.5px; }
        .composer__run-options label:last-of-type select { max-width: 104px; }
        .composer__send { flex: 0 0 auto; padding: 8px 17px; font-size: 13px; }

        .iconbtn { min-width: 44px; min-height: 44px; font-size: 14px; border-radius: 10px; }
        .tree-row { padding-top: 8px; padding-bottom: 8px; font-size: 12px; min-height: 38px; }
        .insight-row { padding: 9px 8px; font-size: 12px; }
        .acc-head { padding: 10px 8px; font-size: 10.5px; }

        .dialog { max-width: 94% !important; padding: 20px 18px 16px; border-radius: var(--radius-lg); }
        .dialog__title { font-size: 20px; }

        .connect-overlay { gap: 14px; }
        .connect-orb { width: 32px; height: 32px; }

        .statusbar__side > .iconbtn { width: 30px; min-width: 30px; min-height: 30px; }
        .composer__textarea { width: 100%; box-sizing: border-box; }
        .msg-action[title*="Export"] { display: none; }
      }

      @media (orientation: landscape) and (max-height: 700px) {
        :root { --rail-w: 0px; --insight-w: 0px; }
        .rail, .insight { display: none; }
        .statusbar__side > .iconbtn { width: 30px; min-width: 30px; min-height: 30px; border-radius: 5px; }
        .app-body { grid-template-columns: 0px 1fr 0px !important; }
        .stage { width: 100vw !important; }
      }

      /* ── Mermaid + SVG diagrams ────────────────────────────────────────── */
      .mermaid-container {
        margin: 14px 0;
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .mermaid-render-target { width: 100%; }
      .mermaid-container svg {
        width: 100% !important;
        max-width: 100%;
        height: auto !important;
      }
      .mermaid-raw { white-space: pre-wrap; font-size: 12px; color: var(--muted); }
      .svg-container {
        margin: 14px 0;
        display: flex;
        justify-content: center;
        padding: 14px;
        background: var(--glass-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
      }
      .svg-container svg { max-width: 100%; height: auto; }
      @media (prefers-reduced-motion: reduce) {
        .breath-dot, .connect-orb, .stream-caret, .toolcard__status.run {
          animation: none;
        }
        .app-body, .chat-refresh, .composer__send {
          transition-duration: 0.01ms;
        }
      }
      .download-target { position: fixed; width: 0; height: 0; border: 0; visibility: hidden; }
      .filetree-menu { position: fixed; z-index: 1000; min-width: 132px; max-width: 220px; padding: 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--glass-2); box-shadow: 0 8px 24px rgba(0,0,0,.20); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); }
      .filetree-menu button { width: 100%; padding: 7px 9px; border: 0; border-radius: 5px; text-align: left; background: transparent; color: var(--text); }
      .filetree-menu button:not(:disabled):hover, .filetree-menu button:focus-visible { background: var(--surface-hover); outline: 2px solid var(--accent-strong); }
      .filetree-menu button:disabled { opacity: .45; cursor: not-allowed; }
      .filetree-menu__hint { padding: 5px 9px 3px; color: var(--text-muted); font-size: 11px; }
      .msg-export-options { display: inline-flex; gap: 3px; margin-left: 3px; }
      .msg-export-options button { border: 1px solid var(--border); border-radius: 4px; padding: 2px 5px; background: var(--surface); color: var(--text-muted); font-size: 10px; cursor: pointer; }
      .toolcard__details { display: grid; gap: 6px; padding: 8px 12px 12px; }
      .toolcard__details strong { color: var(--text-muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
      .echarts-block { margin: 12px 0; overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
      .echarts-block figcaption { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 11px; }
      .echarts-block figcaption button { border: 1px solid var(--border); border-radius: 4px; background: transparent; color: inherit; cursor: pointer; }
      .echarts-block details { padding: 6px 10px 10px; border-top: 1px solid var(--border); }
      .echarts-block details pre { max-height: 240px; overflow: auto; }

      /* ===== F1 状态宠物（BreathController 驱动的像素猫爪） ===== */
      .pet-corner { position: fixed; right: 18px; bottom: 18px; z-index: 40; pointer-events: none;
        opacity: .92; }
      /* Pet animations live in styles/pet.css (bound to BreathController
         visual CSS variables) — keep only positioning/shadow here. */
      .pet-corner:hover { transform: scale(1.12); }
      .pet-svg { filter: drop-shadow(0 2px 6px rgba(0,0,0,.18)); }

      /* ===== F2 Context X-Ray ===== */
      .xray-root { display: flex; flex-direction: column; gap: 10px; }
      .xray-empty { padding: 14px 10px; color: var(--text-muted); font-size: 11px; line-height: 1.6; }
      .xray-total { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-muted); }
      .xray-total__legend { display: inline-flex; gap: 8px; }
      .xray-total__legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 3px; vertical-align: -1px; }
      .xray-stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
      .xray-stack__seg { display: block; min-width: 2px; }
      .xray-section { display: flex; flex-direction: column; gap: 3px; }
      .xray-section__head { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 4px 0 2px; }
      .xray-section__head strong { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); }
      .xray-section__dot { width: 8px; height: 8px; border-radius: 50%; }
      .xray-section__sum { margin-left: auto; color: var(--text-muted); font-size: 10px; }
      .xray-row { display: grid; grid-template-columns: minmax(70px, 38%) 1fr 42px; gap: 6px; align-items: center; font-size: 10px; }
      .xray-row__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
      .xray-row__bar { height: 8px; background: var(--surface-hover, rgba(127,127,127,.12)); border-radius: 4px; overflow: hidden; }
      .xray-row__fill { display: block; height: 100%; border-radius: 4px; transition: width .3s ease; }
      .xray-row__val { text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; }
      .xray-doctor { border: 1px solid #ffd60a66; background: #ffd60a14; border-radius: 6px; padding: 8px 10px; font-size: 11px; display: flex; flex-direction: column; gap: 3px; }
      .xray-doctor strong { font-size: 10px; letter-spacing: .04em; }
      .xray-doctor__item { color: var(--text-muted); }

      /* ===== F4 Trajectory Replay ===== */
      .traj-root { display: flex; flex-direction: column; gap: 8px; }
      .traj-empty { padding: 14px 10px; color: var(--text-muted); font-size: 11px; }
      .traj-lineage { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 10px;
        border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; background: var(--surface); }
      .traj-lineage strong { font-size: 10px; letter-spacing: .04em; }
      .traj-lineage__hop { color: var(--text-muted); }
      .traj-lineage__cur { color: var(--accent, #0071e3); }
      .traj-axis { display: flex; flex-wrap: wrap; gap: 3px; padding: 4px 0; max-height: 120px; overflow: auto; }
      .traj-node { border: 0; background: transparent; padding: 2px; cursor: pointer; border-radius: 4px; }
      .traj-node:hover { background: var(--surface-hover, rgba(127,127,127,.14)); }
      .traj-node__dot { display: block; width: 9px; height: 9px; border-radius: 50%; }
      .traj-node--user .traj-node__dot { border-radius: 2px; }
      .traj-legend { display: flex; gap: 8px; font-size: 10px; color: var(--text-muted); align-items: center; }
      .traj-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; vertical-align: -1px; }
      .traj-legend__hint { margin-left: auto; opacity: .7; }
      /* Single-workspace refinements: fewer surfaces, clearer hierarchy. */
      body { background: var(--bg); letter-spacing: 0; }
      button, input, textarea, select { font-family: var(--font-sans); }
      button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 3px;
      }
      .statusbar { min-height: var(--statusbar-h); padding: 0 18px; background: #121416; border-color: var(--border); backdrop-filter: none; -webkit-backdrop-filter: none; flex-shrink: 0; }
      .iconbtn svg { width: 16px; height: 16px; flex-shrink: 0; }
      .statusbar__side { gap: 10px; }
      .brand-mark { width: 18px; height: 18px; color: var(--accent); flex-shrink: 0; }
      .statusbar__brand { gap: 10px; letter-spacing: -0.02em; }
      .statusbar__brand i { color: var(--text); font-style: normal; }
      .statusbar__divider { margin: 0 3px; background: var(--border); }
      .statusbar__model { font-size: 10px; color: var(--muted); }
      .iconbtn { width: 28px; height: 28px; border: 0; border-radius: var(--radius-sm); color: var(--muted); box-shadow: none; backdrop-filter: none; }
      .iconbtn:hover { color: var(--text); background: var(--accent-softer); }
      .session-pill { border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--muted); padding: 5px 7px; }
      .session-pill:hover { background: var(--accent-softer); }
      .statusbar__tokens { font-size: 9.5px; color: var(--faint); }
      .breath-status { font-size: 10px; color: var(--muted); }
      .rail, .insight { background: var(--bg-deep); backdrop-filter: none; -webkit-backdrop-filter: none; }
      .filetree__head { padding: 17px 16px 13px; }
      .filetree__root { font-size: 11px; }
      .filetree__rootmark { font-size: 8px; }
      .filetree__tree { padding: 8px; }
      .tree-row { padding: 6px 9px; border-radius: var(--radius-sm); font-size: 11.5px; }
      .tree-row--active { background: var(--accent-soft); }
      .sessionrail__head { padding: 12px 16px 8px; }
      .sessionrail__title { color: var(--muted); font-size: 9px; }
      .sessionrail__list { padding: 3px 8px 10px; }
      .sessionrail__row { padding: 8px; border-radius: var(--radius-sm); }
      .sessionrail__item--current > .sessionrail__row,
      .sessionrail__row.active { background: var(--accent-soft); }
      .sessionrail__row.active .sessionrail__session-title { color: var(--accent); }
      .sessionrail__session-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11px var(--font-sans); }
      .sessionrail__session-meta { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
      .sessionrail__session-date { font-size: 9.5px; color: var(--faint); }
      .sessionrail__session-count { font-size: 9px; font-weight: 400; color: var(--faint); }
      .chat { background: var(--bg); }
      .chat-scroll { padding: 34px max(36px, calc((100% - 820px) / 2)) 12px; }
      .msg { padding: 10px 0; }
      .msg__role { font-size: 9px; margin-bottom: 8px; color: var(--muted); }
      .msg__role-mark { width: 4px; height: 4px; }
      .msg--assistant .msg__bubble { padding: 0; background: transparent; }
      .msg--user .msg__inner { justify-content: flex-start; }
      .msg--user .msg__bubble { max-width: 90%; padding: 12px 16px; background: var(--glass-2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: none; }
      .msg__export { margin-top: 10px; }
      .toolcard { border-radius: var(--radius-md); background: var(--glass); box-shadow: none; backdrop-filter: none; }
      .toolcard__name { font-family: var(--font-mono); font-size: 11px; }
      .thinking { border-radius: var(--radius-sm); background: transparent; border-color: var(--border); }
      .markdown-body { font-size: 14px; line-height: 1.8; }
      .markdown-body pre { border-radius: var(--radius-md); background: #0c0e10; box-shadow: none; }
      .welcome { text-align: left; padding: clamp(44px, 10vh, 104px) 0 32px; color: var(--muted); }
      .welcome__eyebrow { display: flex; align-items: center; gap: 9px; font-size: 9px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .09em; color: var(--faint); }
      .welcome__eyebrow-line { width: 20px; height: 1px; background: var(--accent); }
      .welcome__mark { margin: 17px 0 14px; font-size: clamp(34px, 4.5vw, 48px); font-weight: 600; letter-spacing: -.055em; line-height: 1.1; color: var(--text); }
      .welcome__mark span { color: var(--accent); }
      .welcome__sub { max-width: 360px; font-size: 13px; line-height: 1.75; }
      .welcome__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; margin-top: 26px; }
      .welcome__hint { display: inline-flex; align-items: center; gap: 5px; margin-top: 0; font-family: var(--font-sans); font-size: 10px; color: var(--faint); }
      .welcome__hint kbd { font: 9px var(--font-mono); border: 1px solid var(--border); border-radius: 4px; padding: 3px 5px; background: var(--glass); color: var(--muted); }
      .welcome__context { font-size: 10px; color: var(--faint); }
      .composer { border-top: 1px solid var(--border); padding: 14px max(36px, calc((100% - 820px) / 2)) 16px; background: var(--bg); }
      .composer__shell { border: 1px solid var(--border-strong); border-radius: var(--radius-lg); background: var(--glass); box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
      .composer__shell:focus-within { border-color: var(--accent-strong); box-shadow: 0 0 0 3px var(--accent-softer); }
      .composer__textarea { font-size: 13px; min-height: 64px; padding: 17px 17px 8px; }
      .composer__textarea::placeholder { color: var(--faint); }
      .composer__hint { padding: 8px 10px 9px; }
      .composer__attach { border: 0; color: var(--faint); }
      .composer__run-options { border: 0; padding-left: 0; gap: 12px; }
      .composer__run-options label { gap: 6px; }
      .composer__run-options label > span { font-size: 9px; font-weight: 400; }
      .composer__run-options select { height: 26px; border: 0; border-radius: var(--radius-sm); background: transparent; padding: 0 2px; color: var(--muted); font-size: 10px; }
      .composer__run-options select:hover { background: var(--accent-softer); }
      .composer__send { border-radius: var(--radius-sm); height: 30px; padding: 0 12px; background: var(--accent); color: #142027; box-shadow: none; font-size: 11px; }
      .composer__send:hover:not(:disabled) { background: var(--accent-hover); box-shadow: none; }
      .composer__hint { color: var(--faint); }
      .session-status { display: inline-flex; align-items: center; gap: 7px; font-size: 10px; color: var(--muted); white-space: nowrap; }
      .session-status .breath-dot { display: block; width: 5px; height: 5px; background: var(--green); box-shadow: none; animation: none; }
      .session-status .breath-dot.connecting { background: var(--amber); }
      .session-status .breath-dot.off { background: var(--rose); }
      .modal { border-radius: var(--radius-lg); background: var(--glass-2); }
      .modal__head { padding: 18px 20px; }
      .modal__body { padding: 16px 20px 20px; }
      .modal__title { font-size: 13px; }
      .modal__close { width: 26px; height: 26px; border-radius: var(--radius-sm); background: transparent; }
      .menu, .export-menu, .session-menu, .filetree-menu { border-radius: var(--radius-md); background: var(--glass-2); box-shadow: var(--shadow-lg); }
      .diffstat .add { color: var(--green); }
      .diffstat .del { color: var(--rose); }
      .app-body { transition-duration: .18s; }
      @media (max-width: 1000px) {
        .statusbar { padding: 0 12px; }
        .statusbar__side { gap: 7px; }
        .statusbar__tokens { display: none; }
        .welcome { padding: 44px 0 26px; }
        .welcome__mark { font-size: 36px; }
        .chat-scroll, .composer { padding-left: 24px; padding-right: 24px; }
      }
      @media (max-width: 640px) {
        :root { --rail-w: min(84vw, 300px); --statusbar-h: 50px; }
        .statusbar { padding: 0 8px; }
        .statusbar__side { gap: 2px; }
        .statusbar__side > .iconbtn { width: 28px; min-width: 28px; }
        .statusbar__brand { font-size: 0; gap: 0; }
