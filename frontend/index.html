<!DOCTYPE html>
<html lang="en" data-color-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101214" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'"
    />
    <link rel="manifest" href="/manifest.json" />
    <title>NonoClaw</title>
    <style>
      /* A single neutral workspace: quiet surfaces, crisp type, one cool accent. */
      :root {
        --bg: #101214;
        --bg-deep: #0c0e10;
        --glass: #141719;
        --glass-2: #1b1e21;
        --glass-line: #292d31;
        --border: #292d31;
        --border-strong: #424950;

        --text: #e3e7ea;
        --muted: #99a2ab;
        --faint: #6f7983;

        --mint: #9ec6d8;
        --cyan: #9ec6d8;
        --sky: #9ec6d8;
        --violet: #b5b2d8;
        --magenta: #c6a2be;
        --amber: #d8b58a;
        --rose: #e49595;
        --green: #9ec8af;

        --accent: #9ec6d8;
        --accent-hover: #bdd8e3;
        --accent-soft: rgba(158, 198, 216, 0.12);
        --accent-softer: rgba(158, 198, 216, 0.06);
        --accent-strong: rgba(158, 198, 216, 0.35);

        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.14);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.22);
        --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.35);
        --shadow-dialog: 0 24px 80px rgba(0, 0, 0, 0.48);

        --font-sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-display: var(--font-sans);
        --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;

        --radius-sm: 5px;
        --radius-md: 7px;
        --radius-lg: 10px;
        --radius-xl: 12px;

        --rail-w: 272px;
        --insight-w: 308px;
        --statusbar-h: 56px;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body {
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        overflow: hidden;
        letter-spacing: -0.01em;
      }
      ::selection { background: var(--accent-strong); }

      /* ── App scaffold ───────────────────────────────────────────────────── */
      .app-root {
        position: relative;
        z-index: 2;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .app-body {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: var(--rail-w) 1fr var(--insight-w);
        transition: grid-template-columns 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      }
      .app-body.rail-collapsed { grid-template-columns: 0px 1fr var(--insight-w); }
      .app-body.insight-collapsed { grid-template-columns: var(--rail-w) 1fr 0px; }
      .app-body.rail-collapsed.insight-collapsed { grid-template-columns: 0px 1fr 0px; }

      .rail {
        min-height: 0;
        overflow: hidden;
        border-right: 1px solid var(--border);
        background: rgba(248, 248, 250, 0.66);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        display: flex;
        flex-direction: column;
      }
      .rail__files { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .rail__files--collapsed { flex: 0 0 auto; }
      .rail__sessions {
        border-top: 1px solid var(--border);
        max-height: 30vh;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: auto;
      }
      .rail__git {
        border-top: 1px solid var(--border);
        max-height: 32vh;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: auto;
      }
      .rail__section--collapsed {
        max-height: none;
        overflow: hidden;
        flex: 0 0 auto;
      }
      .insight {
        min-height: 0;
        overflow: hidden;
        border-left: 1px solid var(--border);
        background: rgba(248, 248, 250, 0.66);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        display: flex;
        flex-direction: column;
      }
      .stage {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .chat-refresh {
        position: absolute;
        top: 10px;
        right: 12px;
        z-index: 8;
        appearance: none;
        background: var(--glass);
        border: 1px solid var(--border);
        color: var(--muted);
        width: 30px;
        height: 30px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 15px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        transition: color 0.15s, transform 0.5s cubic-bezier(0.32, 0.72, 0, 1), border-color 0.15s;
      }
      .chat-refresh:hover { color: var(--accent); border-color: var(--accent-strong); }
      .chat-refresh:active { transform: rotate(180deg); }
      .tool-hidden-placeholder {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        margin: 4px 0;
        border: 1px dashed var(--border);
        border-radius: var(--radius-sm);
        background: var(--glass);
        color: var(--faint);
        font-family: var(--font-mono);
        font-size: 11px;
        cursor: default;
      }
      .tool-hidden-placeholder__icon { color: var(--faint); font-size: 12px; }
      .tool-hidden-placeholder__text { letter-spacing: 0.02em; }
      .chat-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 28px max(28px, calc((100% - 920px) / 2)) 8px;
        scroll-behavior: smooth;
      }
      @media (max-width: 1000px) {
        :root { --insight-w: 0px; }
        .insight { display: none; }
        .app-body, .app-body.insight-collapsed { grid-template-columns: var(--rail-w) 1fr 0px; }
        .app-body.rail-collapsed { grid-template-columns: 0px 1fr 0px; }
      }

      /* ── Technical trace ───────────────────────────────────────────────── */
      .trace {
        flex: none;
        max-height: 56%;
        min-height: 148px;
        display: flex;
        flex-direction: column;
        border-bottom: 1px solid var(--border);
        background: var(--accent-softer);
      }
      .trace__summary {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 1px;
        padding: 8px 8px 4px;
      }
      .trace__summary > div { min-width: 0; padding: 5px 6px; border-radius: 7px; background: var(--glass); }
      .trace__summary span { display: block; font-family: var(--font-mono); font-size: 8px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
      .trace__summary b { display: block; margin-top: 2px; color: var(--text); font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .trace__controls, .trace__filters { display: flex; align-items: center; gap: 4px; padding: 3px 8px; }
      .trace__controls select, .trace__filters select, .trace__filters input {
        min-width: 0; height: 25px; border: 1px solid var(--border); border-radius: 7px;
        background: var(--glass); color: var(--text); font-family: var(--font-mono); font-size: 9.5px; outline: none;
      }
      .trace__controls select { flex: 1; padding: 0 5px; }
      .trace__controls button {
        appearance: none; height: 25px; padding: 0 7px; border: 1px solid var(--border); border-radius: 7px;
        background: var(--glass); color: var(--muted); cursor: pointer; font-family: var(--font-mono); font-size: 9px;
      }
      .trace__controls button:hover:not(:disabled) { color: var(--accent); border-color: var(--accent-strong); }
      .trace__controls button:disabled { opacity: .35; cursor: default; }
      .trace__filters { flex-wrap: wrap; }
      .trace__filters input { flex: 1 1 100%; padding: 0 7px; }
      .trace__filters select { flex: 1; padding: 0 4px; }
      .trace__developer { display: inline-flex; align-items: center; gap: 4px; color: var(--faint); font: 9px var(--font-mono); white-space: nowrap; }
      .trace__developer input { width: 12px; height: 12px; accent-color: var(--accent); }
      .trace__notice, .trace__window-note { padding: 2px 10px; color: var(--accent); font: 9px var(--font-mono); }
      .trace__timeline { flex: 1; min-height: 56px; overflow: auto; padding: 3px 8px 8px; contain: strict; }
      .trace__empty { padding: 14px 8px; color: var(--faint); font: 10px/1.5 var(--font-mono); }
      .trace-run { margin: 2px 0 7px; }
      .trace-run__head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 6px; padding: 4px 5px; color: var(--muted); background: var(--glass-2); border-radius: 6px; font: 9px var(--font-mono); }
      .trace-run__head span:nth-child(2) { flex: 1; color: var(--text); font-weight: 600; }
      .trace-row {
        appearance: none; width: 100%; display: grid; grid-template-columns: 51px 7px minmax(0, 1fr); gap: 5px;
        padding: 5px; border: none; border-left: 2px solid transparent; border-radius: 6px; background: transparent;
        color: var(--text); text-align: left; cursor: default; font-family: var(--font-mono);
      }
      .trace-row[aria-expanded] { cursor: pointer; }
      .trace-row:hover { background: var(--glass); }
      .trace-row:focus-visible, .trace__controls button:focus-visible, .trace select:focus-visible, .trace input:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 1px; }
      .trace-row--failure { border-left-color: var(--rose); }
      .trace-row--cancel { border-left-color: var(--faint); }
      .trace-row__time { padding-top: 1px; color: var(--faint); font-size: 8.5px; }
      .trace-row__body { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
      .trace-row__summary { overflow: hidden; color: var(--text); text-overflow: ellipsis; white-space: nowrap; font: 10px/1.25 var(--font-sans); }
      .trace-row__meta { color: var(--faint); font-size: 8.5px; }
      .trace-row__details { display: flex; flex-direction: column; gap: 2px; margin: 5px 0 1px; padding: 5px 6px; border: 1px solid var(--border); border-radius: 6px; background: rgba(0,0,0,.025); overflow: hidden; }
      [data-color-scheme="dark"] .trace-row__details { background: rgba(0,0,0,.18); }
      .trace-row__details > span { display: grid; grid-template-columns: 78px minmax(0,1fr); gap: 5px; }
      .trace-row__details i { color: var(--faint); font-size: 8.5px; font-style: normal; }
      .trace-row__details code { overflow-wrap: anywhere; color: var(--muted); font-size: 8.5px; white-space: normal; }
      .trace-pip { width: 6px; height: 6px; margin-top: 2px; border-radius: 50%; background: var(--faint); flex: none; }
      .trace-pip--active { background: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
      .trace-pip--waiting { background: var(--amber); }
      .trace-pip--success { background: var(--green); }
      .trace-pip--warning { background: var(--amber); }
      .trace-pip--failure { background: var(--rose); }
      .trace-pip--cancel { background: var(--faint); }
      .trace-status--active { color: var(--accent) !important; }
      .trace-status--success { color: var(--green) !important; }
      .trace-status--failure { color: var(--rose) !important; }
      .trace-status--cancel { color: var(--faint) !important; }

      /* ── Insight accordion + rows ───────────────────────────────────────── */
      .acc { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 8px 26px; }
      .acc-section { border-bottom: 1px solid var(--border); }
      .acc-section:last-child { border-bottom: none; }
      .acc-head {
        appearance: none;
        width: 100%;
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 9px 10px;
        font-family: var(--font-sans);
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-align: left;
        transition: color 0.13s, background 0.13s;
        border-radius: var(--radius-sm);
      }
      .acc-head:hover { color: var(--text); background: var(--accent-softer); }
      .acc-head__caret { width: 9px; font-size: 9px; color: var(--faint); }
      .acc-head__label { flex: 1; }
      .acc-head__count {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--accent);
        background: var(--accent-soft);
        border: none;
        border-radius: 999px;
        padding: 1px 8px;
        min-width: 18px;
        text-align: center;
      }
      .acc-head__count.zero { color: var(--faint); background: rgba(0, 0, 0, 0.05); }
      [data-color-scheme="dark"] .acc-head__count.zero { background: rgba(255, 255, 255, 0.07); }
      .acc-body { padding: 2px 6px 12px; display: flex; flex-direction: column; gap: 3px; }
      .acc-empty { color: var(--faint); font-size: 11.5px; padding: 4px 8px; font-family: var(--font-mono); }

      .insight-row {
        appearance: none;
        width: 100%;
        text-align: left;
        background: transparent;
        border: none;
        border-radius: var(--radius-sm);
        padding: 7px 10px;
        cursor: pointer;
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 12.5px;
        line-height: 1.4;
        display: flex;
        flex-direction: column;
        gap: 2px;
        transition: background 0.12s;
      }
      .insight-row:hover { background: var(--accent-softer); }
      .insight-row__top { display: flex; align-items: center; gap: 7px; }
      .insight-row__name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
      .insight-row__meta {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tag {
        font-family: var(--font-mono);
        font-size: 9.5px;
        padding: 1px 7px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.05);
        color: var(--muted);
        white-space: nowrap;
        border: none;
      }
      [data-color-scheme="dark"] .tag { background: rgba(255, 255, 255, 0.08); }
      .tag.ro { color: var(--accent); background: var(--accent-soft); }
      .tag.write { color: var(--amber); background: rgba(255, 159, 10, 0.14); }
      .tag.builtin { color: var(--violet); background: rgba(125, 122, 255, 0.14); }
      .tag.mcp { color: var(--magenta); background: rgba(191, 90, 242, 0.14); }
      .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
      .dot.on { background: var(--green); }
      .dot.off { background: var(--faint); }
      .dot.bad { background: var(--rose); }
      /* Model health probe: blue = reachable (distinct from the active
         green dot); pulse while the sweep is running. */
      .dot.probe-ok { background: var(--clr-accent, #2f6fed); }
      .dot.probe-pending { background: var(--faint); opacity: 0.5; animation: dot-pulse 1.1s ease-in-out infinite; }
      @keyframes dot-pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.8; } }
      .acc-head__extra { margin-left: auto; display: inline-flex; align-items: center; }
      .models-probe-btn {
        appearance: none;
        border: 1px solid var(--hairline, rgba(128,128,128,0.3));
        background: transparent;
        color: var(--faint);
        font-family: var(--font-mono);
        font-size: 9.5px;
        padding: 1px 7px;
        border-radius: 999px;
        cursor: pointer;
        transition: color 0.12s, border-color 0.12s;
      }
      .models-probe-btn:hover:not(:disabled) { color: var(--text); border-color: var(--text); }
      .models-probe-btn:disabled { opacity: 0.55; cursor: default; }

      .kv { display: flex; flex-direction: column; gap: 7px; padding: 2px 8px; }
      .kv__row { display: flex; gap: 8px; align-items: baseline; font-size: 12px; }
      .kv__k { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.05em; min-width: 64px; }
      .kv__v { color: var(--text); word-break: break-all; font-family: var(--font-mono); font-size: 11.5px; }
      .kv__v a { color: var(--accent); text-decoration: none; }

      /* ── Cache hit-rate visualization (insight) ─────────────────────────── */
      .cache { padding: 2px 8px; display: flex; flex-direction: column; gap: 6px; }
      .cache__head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .cache__head-label {
        font-family: var(--font-mono); font-size: 10px; color: var(--faint);
        text-transform: uppercase; letter-spacing: 0.05em;
      }
      .cache__pct {
        font-family: var(--font-mono); font-size: 15px; font-weight: 600;
        color: var(--green);
      }
      .cache__pct.zero { color: var(--faint); }
      .cache__bar {
        height: 8px; border-radius: 999px; overflow: hidden;
        display: flex; background: rgba(127, 127, 127, 0.18);
        border: 1px solid var(--border);
      }
      .cache__seg { height: 100%; }
      .cache__seg--hit { background: var(--green); }
      .cache__seg--write { background: var(--amber); }
      .cache__seg--miss { background: rgba(127, 127, 127, 0.35); }
      .cache__legend { display: flex; gap: 10px; flex-wrap: wrap; }
      .cache__legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--faint); font-family: var(--font-mono); }
      .cache__legend-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
      .cache__legend-dot--hit { background: var(--green); }
      .cache__legend-dot--write { background: var(--amber); }
      .cache__legend-dot--miss { background: rgba(127, 127, 127, 0.5); }
      .cache__empty { color: var(--faint); font-size: 11px; }

      .cli-ref { padding: 2px 8px 8px; }
      .cli-ref__ex {
        font-family: var(--font-mono); font-size: 11px; color: var(--accent);
        background: var(--accent-softer); border: 1px solid var(--border);
        border-radius: var(--radius-sm); padding: 8px 10px; margin: 5px 0 8px;
      }
      .cli-ref__ex-title,
      .cli-ref__group-title {
        font-family: var(--font-mono); font-size: 10px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.06em;
      }
      .cli-ref__ex-title { color: var(--muted); margin-bottom: 5px; }
      .cli-ref__example { padding: 5px 0; border-top: 1px dashed var(--border); }
      .cli-ref__example-label { display: block; color: var(--faint); margin-bottom: 2px; }
      .cli-ref__example-command {
        display: block; color: var(--accent); font: inherit; line-height: 1.45;
        white-space: pre-wrap; overflow-wrap: anywhere;
      }
      .cli-ref__constraint {
        margin: 0 0 9px; padding: 7px 8px; border-left: 2px solid var(--sky);
        background: color-mix(in srgb, var(--sky) 7%, transparent);
        color: var(--muted); font-size: 10.5px; line-height: 1.45;
      }
      .cli-ref__constraint code { font-family: var(--font-mono); color: var(--sky); }
      .cli-ref__group { margin-top: 9px; }
      .cli-ref__group-title {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        color: var(--faint); padding-bottom: 3px; border-bottom: 1px solid var(--border);
      }
      .cli-ref__group-count {
        flex: none; border-radius: 999px; padding: 1px 6px;
        background: rgba(127, 127, 127, 0.12); color: var(--faint);
        font-family: var(--font-mono); font-size: 9px;
      }
      .cli-ref__flag { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--border); }
      .cli-ref__flag:last-child { border-bottom: none; }
      .cli-ref__flag--rich { display: block; }
      .cli-ref__row { display: grid; grid-template-columns: minmax(92px, 0.8fr) minmax(0, 1.2fr); gap: 8px; }
      .cli-ref__name {
        font-family: var(--font-mono); font-size: 11px; color: var(--sky);
        min-width: 92px; overflow-wrap: anywhere;
      }
      .cli-ref__desc { min-width: 0; font-size: 11.5px; color: var(--muted); line-height: 1.4; }
      .cli-ref__meta { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
      .cli-ref__chip {
        border: 1px solid var(--border); border-radius: 999px; padding: 1px 5px;
        color: var(--faint); background: rgba(127, 127, 127, 0.07);
        font-family: var(--font-mono); font-size: 9px; line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .cli-ref__safety {
        margin-top: 5px; padding: 5px 7px; border-left: 2px solid var(--amber);
        color: var(--muted); background: color-mix(in srgb, var(--amber) 7%, transparent);
        font-size: 10.5px; line-height: 1.45;
      }
      .cli-ref__safety strong { color: var(--amber); }
      .cli-ref__advanced {
        margin-top: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
        background: rgba(127, 127, 127, 0.035); overflow: hidden;
      }
      .cli-ref__advanced > summary {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        padding: 7px 9px; cursor: pointer; color: var(--muted);
        font-family: var(--font-mono); font-size: 10px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.06em; list-style: none;
      }
      .cli-ref__advanced > summary::-webkit-details-marker { display: none; }
      .cli-ref__advanced > summary::before { content: "›"; margin-right: 4px; color: var(--faint); }
      .cli-ref__advanced[open] > summary::before { transform: rotate(90deg); }
      .cli-ref__advanced > summary > span:first-child { flex: 1; }
      .cli-ref__advanced-body { padding: 0 8px 7px; border-top: 1px solid var(--border); }

      @media (max-width: 1050px) {
        .cli-ref__row { grid-template-columns: 1fr; gap: 2px; }
        .cli-ref__name { min-width: 0; }
      }

      /* ── Git pane ───────────────────────────────────────────────────────── */
      .gitpane { display: flex; flex-direction: column; height: 100%; min-height: 0; }

      /* ── Session rail ───────────────────────────────────────────────────── */
      .sessionrail { display: flex; flex-direction: column; height: 100%; min-height: 0; }
      .sessionrail__head {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 8px 12px 6px;
        flex-shrink: 0;
        border: none;
        background: none;
        cursor: pointer;
        text-align: left;
      }
      .sessionrail__head-caret { color: var(--faint); font-size: 9px; }
      .sessionrail__title {
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        flex: 1;
      }
      .sessionrail__head-count {
        font-family: var(--font-mono);
        font-size: 9.5px;
        color: var(--faint);
        background: rgba(0, 0, 0, 0.05);
        border-radius: 999px;
        padding: 1px 7px;
      }
      [data-color-scheme="dark"] .sessionrail__head-count { background: rgba(255, 255, 255, 0.08); }
      .sessionrail__list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 6px 8px; }
      .sessionrail__empty {
        padding: 6px 12px;
        font-size: 11px;
        color: var(--faint);
        font-family: var(--font-mono);
        line-height: 1.6;
      }
      .sessionrail__empty--guide { text-align: left; }
      .sessionrail__empty-icon { display: block; font-size: 18px; margin-bottom: 4px; opacity: 0.6; }
      .sessionrail__item { border-radius: 8px; }
      .sessionrail__item--current > .sessionrail__row { background: rgba(0, 0, 0, 0.04); }
      [data-color-scheme="dark"] .sessionrail__item--current > .sessionrail__row { background: rgba(255, 255, 255, 0.06); }
      .sessionrail__row {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 5px 8px;
        border: none;
        background: none;
        cursor: pointer;
        border-radius: 8px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text);
        text-align: left;
        transition: background 0.12s ease;
      }
      .sessionrail__row:hover { background: rgba(0, 0, 0, 0.05); }
      [data-color-scheme="dark"] .sessionrail__row:hover { background: rgba(255, 255, 255, 0.07); }
      .sessionrail__caret { color: var(--faint); font-size: 9px; flex-shrink: 0; }
      .sessionrail__machine { margin-top: 6px; border-top: 1px dashed var(--border); padding-top: 6px; }
      .sessionrail__row--machine .sessionrail__date { color: var(--faint); font-size: 10px; }
      .sessionrail__row--machine .sessionrail__count { background: rgba(0, 0, 0, 0.07); }
      [data-color-scheme="dark"] .sessionrail__row--machine .sessionrail__count { background: rgba(255, 255, 255, 0.1); }
      .sessionrail__date { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sessionrail__count {
        flex-shrink: 0;
        font-size: 9.5px;
        color: var(--faint);
        background: rgba(0, 0, 0, 0.05);
        border-radius: 999px;
        padding: 1px 7px;
      }
      [data-color-scheme="dark"] .sessionrail__count { background: rgba(255, 255, 255, 0.08); }
      .sessionrail__prompts {
        margin: 1px 4px 5px 22px;
        border-left: 1px solid var(--border);
        padding-left: 2px;
      }
      .sessionrail__prompt {
        display: flex;
        align-items: baseline;
        gap: 7px;
        width: 100%;
        padding: 4px 8px;
        border: none;
        background: none;
        cursor: pointer;
        border-radius: 6px;
        text-align: left;
        transition: background 0.12s ease;
      }
      .sessionrail__prompt:hover { background: rgba(0, 0, 0, 0.05); }
      [data-color-scheme="dark"] .sessionrail__prompt:hover { background: rgba(255, 255, 255, 0.07); }
      .sessionrail__prompt-num {
        flex-shrink: 0;
        font-family: var(--font-mono);
        font-size: 9px;
        color: var(--faint);
        min-width: 12px;
      }
      .sessionrail__prompt-text {
        font-size: 11.5px;
        line-height: 1.4;
        color: var(--muted);
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        word-break: break-word;
      }
      .sessionrail__prompt:hover .sessionrail__prompt-text { color: var(--text); }

      /* ── Located message highlight (session-rail jump) ──────────────────── */
      .msg--located .msg__bubble {
        animation: msg-locate-pulse 3s ease-out;
      }
      .msg--located.msg--assistant .msg__bubble {
        animation: msg-locate-pulse-bg 3s ease-out;
        border-radius: 12px;
      }
      @keyframes msg-locate-pulse {
        0%   { box-shadow: 0 0 0 3px var(--accent); }
        70%  { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
        100% { box-shadow: 0 0 0 0 transparent; }
      }
      @keyframes msg-locate-pulse-bg {
        0%   { background: color-mix(in srgb, var(--accent) 14%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent); }
        70%  { background: color-mix(in srgb, var(--accent) 7%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
        100% { background: transparent; box-shadow: 0 0 0 0 transparent; }
      }
      .gitpane__head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 7px; }
      .gitpane__head-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
        min-width: 0;
        border: none;
        background: none;
        cursor: pointer;
        padding: 0;
        text-align: left;
      }
      .gitpane__head-caret { color: var(--faint); font-size: 9px; }
      .gitpane__title { font-family: var(--font-sans); font-weight: 600; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
      .gitpane__dirty-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        flex-shrink: 0;
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
      }
      .gitpane__body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 12px; }
      .git-branch {
        display: inline-flex; align-items: center; gap: 6px;
        font-family: var(--font-mono); font-size: 12px; color: var(--accent);
        background: var(--accent-soft);
        border-radius: 999px; padding: 4px 11px;
      }
      .git-dots { display: flex; flex-wrap: wrap; gap: 9px; margin: 9px 0; }
      .git-dot { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
      .git-dot .pip { width: 7px; height: 7px; border-radius: 50%; }
      .git-dot .pip.staged { background: var(--green); }
      .git-dot .pip.modified { background: var(--amber); }
      .git-dot .pip.untracked { background: var(--faint); }
      .git-dot .pip.conflict { background: var(--rose); }
      .git-dot b { color: var(--text); font-weight: 600; }
      .git-commits { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
      .git-commit { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .git-commit .sha { color: var(--violet); }
      .git-empty { font-family: var(--font-mono); font-size: 11px; color: var(--amber); padding: 4px 0; }
      .git-none { font-family: var(--font-mono); font-size: 11px; color: var(--faint); padding: 4px 0; }
      .git-commit--btn {
        appearance: none;
        width: 100%;
        text-align: left;
        background: transparent;
        border: none;
        border-radius: 6px;
        padding: 3px 6px;
        margin: 0;
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: background 0.12s, color 0.12s;
      }
      .git-commit--btn:hover { background: var(--accent-softer); color: var(--text); }
      .git-commit--btn .sha { color: var(--violet); }

      /* ── Tool schema (expandable) ───────────────────────────────────────── */
      .insight-row--tool { cursor: pointer; }
      .schema { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); }
      .schema__none { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }
      .schema__prop { display: flex; flex-direction: column; gap: 1px; }
      .schema__head { display: flex; gap: 8px; align-items: baseline; }
      .schema__name { font-family: var(--font-mono); font-size: 11.5px; color: var(--sky); }
      .schema__req { color: var(--rose); margin-left: 1px; }
      .schema__type { font-family: var(--font-mono); font-size: 10px; color: var(--faint); }
      .schema__desc { font-size: 11px; color: var(--muted); line-height: 1.4; }
      .commit-pre { max-height: 62vh; white-space: pre; color: var(--text); font-size: 11.5px; line-height: 1.5; }
      .git-filter {
        width: 100%;
        margin: 9px 0 6px;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.03);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 11px;
        outline: none;
        transition: border-color 0.15s, background 0.15s;
      }
      [data-color-scheme="dark"] .git-filter { background: rgba(255, 255, 255, 0.05); }
      .git-filter:focus { border-color: var(--accent-strong); background: var(--glass); }
      .git-filter::placeholder { color: var(--faint); }
      .git-commit__subj { color: var(--text); }
      .git-commit__meta { color: var(--faint); }
      .schema__label { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin-top: 4px; }
      .schema__prompt { font-size: 11.5px; color: var(--muted); line-height: 1.5; white-space: pre-wrap; }

      /* ── File tree (Finder style) ───────────────────────────────────────── */
      .filetree {
        display: flex;
        flex-direction: column;
        height: 100%;
        font-size: 12.5px;
        font-family: var(--font-mono);
      }
      .filetree__head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 12px 10px;
        border-bottom: 1px solid var(--border);
        gap: 6px;
      }
      .filetree__root {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--text);
        font-family: var(--font-sans);
        font-weight: 600;
        font-size: 13px;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .filetree__root--toggle {
        border: none;
        background: none;
        cursor: pointer;
        padding: 0;
        min-width: 0;
        text-align: left;
      }
      .filetree__root--toggle:hover .filetree__rootmark { color: var(--accent); }
      .filetree__rootmark { color: var(--accent); font-size: 9px; }
      .filetree__actions { display: flex; gap: 2px; }
      .filetree__switcher {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-raised, transparent);
      }
      .filetree__switcher input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font-size: 12px;
        font-family: var(--font-mono);
      }
      .filetree__switcher input:focus { outline: 1px solid var(--accent); }
      .filetree__switcher__recents {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .filetree__switcher__recents button {
        border: 1px solid var(--border);
        background: none;
        color: var(--text);
        border-radius: 999px;
        padding: 2px 9px;
        font-size: 11px;
        cursor: pointer;
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .filetree__switcher__recents button:hover { border-color: var(--accent); color: var(--accent); }
      .filetree__switcher__go {
        border: none;
        background: var(--accent);
        color: var(--bg);
        border-radius: 8px;
        padding: 5px 0;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .filetree__switcher__go:disabled { opacity: 0.4; cursor: default; }
      .filetree__list { flex: 1; overflow-y: auto; padding: 6px 6px 24px; }
      .filetree__empty { color: var(--faint); padding: 12px 10px; font-size: 11px; }

      .iconbtn {
        appearance: none;
        background: transparent;
        border: none;
        color: var(--muted);
        width: 26px;
        height: 26px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-mono);
        transition: color 0.15s, background 0.15s;
      }
      .iconbtn:hover { color: var(--accent); background: var(--accent-softer); }
      .iconbtn:disabled { opacity: 0.5; cursor: default; }
      .iconbtn .spin { display: inline-block; animation: iconbtn-spin 0.9s linear infinite; }
      @keyframes iconbtn-spin { to { transform: rotate(360deg); } }

      .tree-row {
        appearance: none;
        width: 100%;
        text-align: left;
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding-top: 4px;
        padding-bottom: 4px;
        padding-right: 8px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-mono);
        font-size: 12.5px;
        line-height: 1.5;
        transition: background 0.1s, color 0.1s;
      }
      .tree-row:hover { background: var(--accent-softer); color: var(--text); }
      .tree-row--dir { color: var(--text); font-weight: 500; }
      .tree-row__caret { width: 9px; color: var(--faint); font-size: 9px; }
      .tree-row__glyph { width: 14px; text-align: center; font-size: 10px; color: var(--faint); }
      .tree-row__glyph--dir { color: var(--violet); }
      .tree-row--dir:hover .tree-row__glyph--dir { color: var(--accent); }
      .tree-row__name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tree-row--file:hover .tree-row__name { color: var(--accent); }

      /* ── Chat messages ──────────────────────────────────────────────────── */
      .msg-enter { animation: msg-rise 0.4s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      @keyframes msg-rise {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .stream-caret {
        display: inline-block;
        width: 2px;
        height: 1.05em;
        margin-left: 3px;
        vertical-align: text-bottom;
        border-radius: 1px;
        background: var(--accent);
        animation: caret-pulse 1.1s ease-in-out infinite;
      }
      .stream-plain {
        font-family: var(--font-sans);
        font-size: 15px;
        line-height: 1.65;
        letter-spacing: 0;
        color: var(--text);
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        margin: 0;
        padding: 0;
        background: transparent;
        border: none;
        overflow: visible;
      }
      .msg-action {
        appearance: none;
        background: transparent;
        border: none;
        color: var(--faint);
        cursor: pointer;
        font-size: 12px;
        padding: 0 2px;
        margin-left: 4px;
        opacity: 0;
        transition: opacity 0.15s, color 0.15s;
      }
      .msg:hover .msg-action { opacity: 1; }
      .msg-action:hover { color: var(--accent); }
      .export-menu {
        position: absolute;
        top: 100%;
        right: 0;
        z-index: 20;
        background: var(--glass-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 5px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 150px;
        box-shadow: var(--shadow-lg);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
      }
      .export-menu button {
        appearance: none;
        background: transparent;
        border: none;
        color: var(--text);
        cursor: pointer;
        font-family: var(--font-sans);
        font-size: 12.5px;
        padding: 7px 11px;
        border-radius: 8px;
        text-align: left;
      }
      .export-menu button:hover { background: var(--accent-softer); color: var(--accent); }
      @keyframes caret-pulse {
        0%, 100% { opacity: 0.2; transform: scaleY(0.85); }
        50%      { opacity: 1;    transform: scaleY(1.05); }
      }

      /* ── Scrollbars (macOS style) ───────────────────────────────────────── */
      * { scrollbar-width: thin; scrollbar-color: rgba(0, 0, 0, 0.18) transparent; }
      [data-color-scheme="dark"] * { scrollbar-color: rgba(255, 255, 255, 0.22) transparent; }
      *::-webkit-scrollbar { width: 8px; height: 8px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.16);
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: padding-box;
        transition: background 0.2s ease;
      }
      [data-color-scheme="dark"] *::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); background-clip: padding-box; }
      *::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.32); background-clip: padding-box; }
      [data-color-scheme="dark"] *::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.34); background-clip: padding-box; }
      *::-webkit-scrollbar-corner { background: transparent; }

      /* ── Markdown (Apple documentation style) ───────────────────────────── */
      .markdown-body { font-size: 15px; line-height: 1.7; letter-spacing: 0; color: var(--text); user-select: text; }
      .markdown-body p { margin: 0.75em 0; }
      .markdown-body h1, .markdown-body h2, .markdown-body h3 {
        font-family: var(--font-display);
        font-weight: 700;
        letter-spacing: -0.022em;
        line-height: 1.2;
        margin: 1.2em 0 0.5em;
        color: var(--text);
      }
      .markdown-body h1 { font-size: 1.6em; }
      .markdown-body h2 { font-size: 1.32em; }
      .markdown-body h3 { font-size: 1.13em; }
      .markdown-body ul, .markdown-body ol { margin: 0.6em 0 0.6em 1.3em; }
      .markdown-body li { margin: 0.3em 0; }
      .markdown-body li::marker { color: var(--accent); }
      .markdown-body strong { font-weight: 600; }
      .markdown-body em { color: inherit; }
      .markdown-body a { color: var(--accent); text-decoration: none; }
      .markdown-body a:hover { text-decoration: underline; }
      .markdown-body code {
        font-family: var(--font-mono);
        font-size: 0.85em;
        background: rgba(0, 0, 0, 0.055);
        padding: 2px 6px;
        border-radius: 5px;
        color: var(--text);
      }
      [data-color-scheme="dark"] .markdown-body code { background: rgba(255, 255, 255, 0.09); }
      .markdown-body pre {
        font-family: var(--font-mono);
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 14px 16px;
        overflow: auto;
        font-size: 12.8px;
        line-height: 1.6;
        margin: 1.1em 0;
        box-shadow: var(--shadow-sm);
      }
      [data-color-scheme="dark"] .markdown-body pre { background: #1e1e20; }
      .markdown-body pre code { background: none; color: var(--text); padding: 0; }
      .markdown-body blockquote {
        border-left: 3px solid var(--accent-soft);
        border-left-color: var(--accent);
        padding: 2px 0 2px 14px;
        color: var(--muted);
        margin: 1em 0;
      }
      .markdown-body table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 1em 0; }
      .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; }
      .markdown-body th { background: var(--accent-softer); font-weight: 600; }
      .markdown-body hr { border: none; border-top: 1px solid var(--border); margin: 1.4em 0; }

      /* Code highlighting — Xcode palette. */
      .hljs-keyword, .hljs-built_in { color: #ad3da4; }
      .hljs-string, .hljs-attr { color: #d12f1b; }
      .hljs-comment { color: #707f8c; font-style: italic; }
      .hljs-function .hljs-title, .hljs-title.function_ { color: #3a5fbf; }
      .hljs-number, .hljs-literal { color: #272ad8; }
      .hljs-type, .hljs-class .hljs-title, .hljs-title.class_ { color: #5c2699; }
      .hljs-variable, .hljs-params { color: var(--text); }
      .hljs-meta { color: var(--faint); }
      .hljs-punctuation { color: var(--muted); }
      [data-color-scheme="dark"] .hljs-keyword, [data-color-scheme="dark"] .hljs-built_in { color: #fc6fad; }
      [data-color-scheme="dark"] .hljs-string, [data-color-scheme="dark"] .hljs-attr { color: #ff8170; }
      [data-color-scheme="dark"] .hljs-comment { color: #7f8c98; }
      [data-color-scheme="dark"] .hljs-function .hljs-title, [data-color-scheme="dark"] .hljs-title.function_ { color: #87c4ff; }
      [data-color-scheme="dark"] .hljs-number, [data-color-scheme="dark"] .hljs-literal { color: #d9c97c; }
      [data-color-scheme="dark"] .hljs-type, [data-color-scheme="dark"] .hljs-class .hljs-title, [data-color-scheme="dark"] .hljs-title.class_ { color: #d0a8ff; }

      /* ── Status bar (macOS toolbar style) ───────────────────────────────── */
      .statusbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 14px;
        min-height: 48px;
        border-bottom: 1px solid var(--border);
        background: var(--glass);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        font-family: var(--font-sans);
        font-size: 12px;
        color: var(--muted);
      }
      .statusbar__side { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .statusbar__brand {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 17px;
        letter-spacing: -0.022em;
        line-height: 1;
        color: var(--text);
        white-space: nowrap;
      }
      .statusbar__brand i { color: var(--accent); font-style: normal; }
      .statusbar__divider { width: 1px; height: 18px; background: var(--border); }
      .statusbar__model { color: var(--accent); font-weight: 500; }
      .statusbar__tokens { color: var(--faint); font-size: 11px; white-space: nowrap; font-family: var(--font-mono); }
      .statusbar__tokens b { color: var(--muted); font-weight: 500; }
      .statusbar__cost { color: var(--amber); }
      .breath-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--green);
        animation: breath-pulse 2.6s ease-in-out infinite;
      }
      .breath-dot.connecting { background: var(--amber); }
      .breath-dot.off { background: var(--rose); animation: none; }
      .breath-dot[data-phase="thinking"],
      .breath-dot[data-phase="streaming"],
      .breath-dot[data-phase="tool"],
      .breath-dot[data-phase="subagent"] { background: var(--accent); }
      .breath-status {
        max-width: 132px;
        overflow: hidden;
        color: var(--muted);
        font: 10.5px var(--font-mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .theme-check {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .theme-check::after {
        content: "✓";
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
        text-shadow: 0 1px 2px rgba(0,0,0,.3);
        filter: drop-shadow(0 0 2px rgba(255,255,255,.5));
      }
      @keyframes breath-pulse {
        0%, 100% { transform: scale(0.8); opacity: 0.65; }
        50% { transform: scale(1.12); opacity: 1; }
      }
      .session-pill {
        appearance: none;
        background: var(--accent-softer);
        border: none;
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 11px;
        padding: 4px 11px;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .session-pill:hover { background: var(--accent-soft); color: var(--accent); }
      .mode-select {
        appearance: none;
        background: var(--accent-softer);
        border: none;
        color: var(--accent);
        font-family: var(--font-sans);
        font-weight: 500;
        font-size: 11px;
        padding: 3px 9px;
        height: 26px;
        line-height: 1.2;
        border-radius: 999px;
        cursor: pointer;
        outline: none;
        transition: background 0.15s;
      }
      .mode-select:hover { background: var(--accent-soft); }
      .mode-select option { background: var(--glass-2); color: var(--text); }
      .tag-compact { color: var(--amber); font-size: 11px; font-family: var(--font-mono); }

      .markdown-lazy-preview {
        margin: 0; white-space: pre-wrap; word-break: break-word;
        font-family: inherit; color: var(--muted);
      }

      /* ── Welcome ────────────────────────────────────────────────────────── */
      .welcome { text-align: center; padding: 14vh 20px 40px; color: var(--muted); }
      .welcome__mark {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 60px;
        letter-spacing: -0.03em;
        line-height: 1;
        color: var(--text);
        margin-bottom: 14px;
      }
      .welcome__mark i { color: var(--accent); font-style: normal; }
      .welcome__sub { font-size: 15px; letter-spacing: -0.01em; }
      .welcome__hint { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); margin-top: 12px; }

      /* ── Messages ───────────────────────────────────────────────────────── */
      .msg {
        margin-bottom: 20px;
        content-visibility: auto;
        contain-intrinsic-size: 0 120px;
      }
      .msg__role {
        font-family: var(--font-sans);
        font-weight: 600;
        font-size: 10.5px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        margin-bottom: 7px;
        display: flex;
        align-items: center;
        gap: 7px;
        position: relative;
      }
      .msg__role--user { color: var(--violet); }
      .msg__role--assistant { color: var(--accent); }
      .msg__role-mark { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .msg__time {
        font-weight: 400;
        font-size: 9.5px;
        letter-spacing: 0.03em;
        color: var(--faint);
        margin-left: 2px;
      }

      .msg--user .msg__inner { display: flex; justify-content: flex-end; }
      .msg--user .msg__bubble {
        max-width: 78%;
        background: linear-gradient(180deg, var(--accent), var(--accent-hover));
        border: none;
        border-radius: 19px 19px 5px 19px;
        padding: 10px 16px;
        color: #ffffff;
        line-height: 1.55;
        letter-spacing: 0;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        box-shadow: var(--shadow-sm);
      }
      .msg__attachments { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .msg__attachment {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
        padding: 4px 9px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.16);
        border: 1px solid rgba(255, 255, 255, 0.2);
        font-family: var(--font-mono);
        font-size: 10.5px;
        line-height: 1.3;
      }
      .msg__attachment-icon { flex-shrink: 0; transform: rotate(-45deg); }
      .msg__attachment-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .msg__image {
        display: block;
        max-width: 280px;
        max-height: 200px;
        width: auto;
        height: auto;
        border-radius: 10px;
        object-fit: contain;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: var(--shadow-sm);
      }
      .msg__image:hover {
        transform: scale(1.02);
        box-shadow: var(--shadow-lg);
      }
      @media (max-width: 768px) {
        .msg__image { max-width: 200px; max-height: 160px; }
      }
      .msg__user-text { display: block; }
      .msg--assistant .msg__bubble { color: var(--text); user-select: text; }

      .msg--system { text-align: center; }
      .msg--system .msg__line {
        display: inline-block;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--muted);
        padding: 4px 12px;
        border: none;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.045);
      }
      [data-color-scheme="dark"] .msg--system .msg__line { background: rgba(255, 255, 255, 0.07); }

      /* ── Tool cards (Apple card style) ──────────────────────────────────── */
      .toolcard {
        margin: 10px 0;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--glass);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .toolcard__head {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 13px;
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 12.5px;
      }
      .toolcard__head:hover { background: var(--accent-softer); }
      .toolcard__status {
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        flex: 0 0 auto;
        min-width: 58px;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        text-align: left;
      }
      .toolcard__status.ok { color: var(--green); }
      .toolcard__status.err { color: var(--rose); }
      .toolcard__status.run { color: var(--amber); animation: caret-pulse 1s ease-in-out infinite; }
      .toolcard__name { color: var(--accent); font-weight: 600; font-family: var(--font-sans); letter-spacing: -0.01em; }
      .toolcard__cmd {
        margin-left: 8px;
        padding: 2px 8px;
        border-radius: 5px;
        background: rgba(0, 0, 0, 0.045);
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 400;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 320px;
      }
      [data-color-scheme="dark"] .toolcard__cmd { background: rgba(255, 255, 255, 0.07); }
      .toolcard__chev { margin-left: auto; color: var(--faint); font-size: 10px; }
      .toolcard__pre {
        margin: 0 13px 12px;
        padding: 11px 13px;
        background: rgba(0, 0, 0, 0.035);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.55;
        color: var(--muted);
        max-height: 300px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      [data-color-scheme="dark"] .toolcard__pre { background: rgba(0, 0, 0, 0.25); }
      .toolcard__child-count {
        flex: 0 0 auto;
        color: var(--faint);
        font-family: var(--font-mono);
        font-size: 10px;
      }
      .subagents { margin: 4px 12px 12px 20px; display: grid; gap: 8px; }
      .subagent { border-left: 2px solid var(--accent-soft); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; background: rgba(0, 0, 0, 0.025); overflow: hidden; }
      [data-color-scheme="dark"] .subagent { background: rgba(255, 255, 255, 0.035); }
      .subagent__head, .subtool__head {
        appearance: none; width: 100%; border: 0; color: var(--text); background: transparent;
        display: flex; align-items: center; gap: 7px; padding: 8px 10px; cursor: pointer;
        text-align: left; font-family: var(--font-sans);
      }
      .subagent__head:hover, .subtool__head:hover { background: var(--accent-softer); }
      .subagent__dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--muted); }
      .subagent__dot.run { background: var(--amber); animation: caret-pulse 1s ease-in-out infinite; }
      .subagent__dot.ok { background: var(--green); }
      .subagent__dot.err { background: var(--rose); }
      .subagent__index { color: var(--faint); font-family: var(--font-mono); font-size: 10px; }
      .subagent__description { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 600; }
      .subagent__profile { flex: 0 0 auto; padding: 1px 6px; border: 1px solid var(--accent-soft); border-radius: 999px; color: var(--accent); font: 9.5px var(--font-mono); }
      .subagent__status { margin-left: auto; flex: 0 0 auto; font: 9.5px var(--font-mono); text-transform: uppercase; }
      .subagent__status.run { color: var(--amber); }
      .subagent__status.ok { color: var(--green); }
      .subagent__status.err { color: var(--rose); }
      .subagent__body { padding: 0 8px 9px 16px; }
      .subagent__tools { display: grid; gap: 5px; margin-bottom: 9px; }
      .subtool { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
      .subtool__head { padding: 6px 8px; font-size: 11px; }
      .subtool__name { color: var(--accent); font-weight: 600; }
      .subtool__status, .subtool__permission { color: var(--muted); font: 9.5px var(--font-mono); }
      .subtool__permission { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .subtool__details { padding-top: 7px; }
      .subtool__details .toolcard__pre { margin-bottom: 7px; max-height: 180px; }
      .subagent__output { color: var(--text); font-size: 12px; line-height: 1.55; }
      .subagent__output > strong { display: block; margin-bottom: 5px; color: var(--muted); font: 10px var(--font-mono); text-transform: uppercase; }
      .subagent__output .stream-plain { font-size: 12px; line-height: 1.55; }
      .subagent__output .markdown-body { font-size: 12px; line-height: 1.55; }
      .subagent__truncated { margin: 4px 9px 7px; color: var(--amber); font: 9.5px var(--font-mono); }

      /* ── Composer (floating Apple capsule) ──────────────────────────────── */
      .composer {
        padding: 8px max(28px, calc((100% - 920px) / 2)) 20px;
        background: linear-gradient(0deg, var(--bg) 40%, transparent);
      }
      .composer__shell {
        position: relative;
        border-radius: var(--radius-xl);
        background: var(--glass-2);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .composer__shell:focus-within {
        border-color: var(--accent-strong);
        box-shadow: var(--shadow-lg), 0 0 0 3px var(--accent-soft);
      }
      .composer__textarea {
        display: block;
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        resize: none;
        padding: 14px 18px 4px;
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 15px;
        letter-spacing: 0;
        line-height: 1.5;
        min-height: 26px;
        max-height: 240px;
        field-sizing: content;
      }
      .composer__textarea::placeholder { color: var(--faint); }
      .composer__hint {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 3px 12px 10px 18px;
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--faint);
      }
      .composer__hint-main {
        display: flex;
        align-items: center;
        flex: 1 1 auto;
        flex-wrap: wrap;
        gap: 6px;
        min-width: 0;
      }
      .composer__shortcuts { white-space: nowrap; }
      .composer__commands { color: var(--muted); }
      .composer__hint kbd {
        font-family: var(--font-mono);
        background: rgba(0, 0, 0, 0.05);
        border: none;
        border-radius: 5px;
        padding: 1px 6px;
        color: var(--muted);
      }
      [data-color-scheme="dark"] .composer__hint kbd { background: rgba(255, 255, 255, 0.08); }
      .composer__run-options {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-left: 2px;
        padding-left: 9px;
        border-left: 1px solid var(--border);
        color: var(--faint);
      }
      .composer__run-options label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }
      .composer__run-options label > span {
        font-size: 8.5px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .composer__run-options select {
        width: auto;
        max-width: 150px;
        height: 26px;
        padding: 0 7px;
        border: 1px solid var(--border);
        border-radius: 999px;
        outline: none;
        background: var(--accent-softer);
        color: var(--text);
        font: 10px var(--font-mono);
        box-shadow: inset 0 1px 0 var(--glass-line);
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .composer__run-options label:last-of-type select { max-width: 112px; }
      .composer__run-options select:hover:not(:disabled) {
        border-color: var(--accent-strong);
        background: var(--accent-soft);
      }
      .composer__run-options select:focus-visible {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }
      .composer__run-options select option {
        background: var(--bg);
        color: var(--text);
      }
      .composer__run-options select:disabled { cursor: not-allowed; opacity: 0.45; }
      .composer__run-status {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      .composer__send {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        appearance: none;
        border: none;
        cursor: pointer;
        font-family: var(--font-sans);
        font-weight: 600;
        font-size: 13px;
        letter-spacing: -0.01em;
        color: #ffffff;
        padding: 7px 17px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: var(--shadow-sm);
        transition: background 0.15s ease, transform 0.12s ease, opacity 0.15s ease;
      }
      .composer__send:hover:not(:disabled) { background: var(--accent-hover); }
      .composer__send:active:not(:disabled) { transform: scale(0.96); }
      .composer__send:disabled { opacity: 0.35; cursor: not-allowed; }
      .composer__send__arrow { transition: transform 0.15s ease; display: inline-block; }
      .composer__send:hover:not(:disabled) .composer__send__arrow { transform: translate(2px, -2px); }

      .composer__stop {
        display: inline-flex;
        align-items: center;
        appearance: none;
        border: none;
        cursor: pointer;
        font-family: var(--font-sans);
        font-weight: 600;
        font-size: 13px;
        letter-spacing: -0.01em;
        color: var(--bg);
        padding: 7px 17px;
        border-radius: 999px;
        background: var(--text);
        box-shadow: var(--shadow-sm);
        transition: background 0.15s ease, transform 0.12s ease, opacity 0.15s ease;
      }
      .composer__stop:hover:not(:disabled) { opacity: 0.85; }
      .composer__stop:active:not(:disabled) { transform: scale(0.96); }
      .composer__stop:disabled { opacity: 0.5; cursor: not-allowed; }

      /* ── Attachments ────────────────────────────────────────────────────── */
      .composer__attach {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border: none;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.05);
        color: var(--muted);
        cursor: pointer;
        flex-shrink: 0;
        transition: color 0.15s ease, background 0.15s ease;
      }
      [data-color-scheme="dark"] .composer__attach { background: rgba(255, 255, 255, 0.08); }
      .composer__attach:hover:not(:disabled) { color: var(--accent); background: var(--accent-soft); }
      .composer__mic {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border: none;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.05);
        color: var(--muted);
        cursor: pointer;
        flex-shrink: 0;
        transition: color 0.15s ease, background 0.15s ease, transform 0.12s;
      }
      [data-color-scheme="dark"] .composer__mic { background: rgba(255, 255, 255, 0.08); }
      .composer__mic:hover:not(:disabled) { color: var(--accent); background: var(--accent-soft); }
      .composer__mic--active { color: var(--rose); background: rgba(255, 69, 58, 0.18) !important; transform: scale(1.12); }
      .composer__mic:disabled { opacity: 0.35; cursor: not-allowed; }
      .composer__attach:disabled { opacity: 0.35; cursor: not-allowed; }
      .composer__shell--dragover {
        border-color: var(--accent) !important;
        box-shadow: var(--shadow-lg), 0 0 0 3px var(--accent-soft) !important;
      }
      .composer__attachments { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px 2px; }
      .composer__chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.045);
        border: none;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text);
        max-width: 240px;
        transition: background 0.15s ease;
      }
      [data-color-scheme="dark"] .composer__chip { background: rgba(255, 255, 255, 0.08); }
      .composer__chip__icon { flex-shrink: 0; font-size: 10px; width: 14px; text-align: center; }
      .composer__chip--uploading { color: var(--amber); }
      .composer__chip--uploading .composer__chip__icon { color: var(--amber); animation: spin 1s linear infinite; }
      .composer__chip--error { color: var(--rose); }
      .composer__chip--error .composer__chip__icon { color: var(--rose); }
      .composer__chip--done .composer__chip__icon { color: var(--green); }
      .composer__chip__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .composer__chip__remove {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        border: none;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.08);
        color: var(--muted);
        cursor: pointer;
        font-size: 11px;
        flex-shrink: 0;
        transition: color 0.15s ease, background 0.15s ease;
      }
      [data-color-scheme="dark"] .composer__chip__remove { background: rgba(255, 255, 255, 0.12); }
      .composer__chip__remove:hover { color: #ffffff; background: var(--rose); }

      /* Image preview chips in composer */
      .composer__preview-chip {
        position: relative;
        display: inline-flex;
        flex-shrink: 0;
        width: 64px;
        height: 64px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(0, 0, 0, 0.1);
        box-shadow: var(--shadow-sm);
      }
      [data-color-scheme="dark"] .composer__preview-chip { border-color: rgba(255, 255, 255, 0.12); }
      .composer__preview-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .composer__preview-remove {
        position: absolute;
        top: 2px;
        right: 2px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border: none;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        cursor: pointer;
        font-size: 12px;
        line-height: 1;
        opacity: 0;
        transition: opacity 0.15s ease, background 0.15s ease;
      }
      .composer__preview-chip:hover .composer__preview-remove { opacity: 1; }
      .composer__preview-remove:hover { background: var(--rose); }
      .composer__preview-loading {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.45);
        animation: pulse 1.2s ease-in-out infinite;
      }
      [data-color-scheme="dark"] .composer__preview-loading { background: rgba(0, 0, 0, 0.4); }
      @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }

      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 768px) {
        .composer__chip { max-width: 160px; font-size: 10px; }
      }

      /* ── Connect overlay ────────────────────────────────────────────────── */
      .connect-overlay {
        position: fixed; inset: 0; z-index: 50;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px;
        background: rgba(245, 245, 247, 0.6);
        backdrop-filter: blur(12px) saturate(180%);
        -webkit-backdrop-filter: blur(12px) saturate(180%);
      }
      [data-color-scheme="dark"] .connect-overlay { background: rgba(22, 22, 25, 0.65); }
      .connect-orb {
        width: 40px; height: 40px; border-radius: 50%;
        background: linear-gradient(180deg, var(--accent), var(--accent-hover));
        box-shadow: var(--shadow-md);
        animation: connect-breath 1.8s ease-in-out infinite;
      }
      @keyframes connect-breath {
        0%, 100% { transform: scale(0.86); opacity: 0.75; }
        50% { transform: scale(1.1); opacity: 1; }
      }
      .connect-label {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: 18px;
        letter-spacing: -0.01em;
        color: var(--muted);
      }

      /* ── Dialogs (Apple sheet style) ────────────────────────────────────── */
      .dialog-overlay {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(14px) saturate(160%);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        animation: msg-rise 0.2s ease both;
      }
      .dialog-overlay.top { align-items: flex-start; padding-top: 11vh; }
      .dialog {
        width: 92%;
        max-width: 540px;
        max-height: 82vh;
        overflow: auto;
        background: var(--glass-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        padding: 24px 26px 22px;
        box-shadow: var(--shadow-dialog);
        backdrop-filter: blur(30px) saturate(180%);
        -webkit-backdrop-filter: blur(30px) saturate(180%);
        animation: sheet-rise 0.3s cubic-bezier(0.32, 0.72, 0, 1) both;
      }
      @keyframes sheet-rise {
        from { opacity: 0; transform: translateY(14px) scale(0.98); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      .dialog__eyebrow {
        font-family: var(--font-sans);
        font-weight: 600;
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--amber);
        margin-bottom: 6px;
      }
      .dialog__eyebrow.mint { color: var(--accent); }
      .dialog__eyebrow.coral { color: #ff6b6b; }
      .dialog__title {
        font-family: var(--font-display);
        font-weight: 700;
        letter-spacing: -0.022em;
        font-size: 23px;
        line-height: 1.15;
        color: var(--text);
        margin-bottom: 4px;
      }
      .dialog__sub { font-family: var(--font-mono); font-size: 12px; color: var(--accent); margin-bottom: 12px; }
      .dialog__body { color: var(--text); font-size: 14px; line-height: 1.6; letter-spacing: 0; }
      .dialog__pre {
        margin: 12px 0;
        padding: 12px 14px;
        background: rgba(0, 0, 0, 0.035);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.55;
        color: var(--muted);
        max-height: 200px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      [data-color-scheme="dark"] .dialog__pre { background: rgba(0, 0, 0, 0.25); }
      .dialog__actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
      /* ── API Log drawer ────────────────────────────────────────────── */
      .api-log-drawer { overflow: hidden; }
      .api-log-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
      .api-log-header__actions { display: flex; gap: 8px; }
      .api-log-body { display: flex; flex: 1; min-height: 0; gap: 12px; margin-top: 10px; }
      .api-log-list { flex: 0 0 240px; min-height: 0; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 6px; }
      .api-log-entry {
        display: flex; align-items: center; gap: 8px; width: 100%;
        padding: 7px 8px; margin-bottom: 4px; border: 1px solid transparent;
        border-radius: var(--radius-sm); background: transparent; text-align: left;
        cursor: pointer; color: var(--text); font-family: var(--font-mono); font-size: 11px;
      }
      .api-log-entry:hover { background: var(--accent-softer); }
      .api-log-entry--active { border-color: var(--accent); background: var(--accent-softer); }
      .api-log-kind {
        flex: 0 0 auto; font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em;
        padding: 2px 5px; border-radius: 4px; color: var(--muted); background: rgba(0,0,0,0.08);
      }
      .api-log-kind--request { color: var(--accent); }
      .api-log-kind--resp { color: #ff6b6b; }
      .api-log-kind--summary { color: var(--amber); }
      .api-log-entry__meta { display: flex; flex-direction: column; min-width: 0; }
      .api-log-entry__trace { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
      .api-log-entry__time { color: var(--faint); font-size: 10px; }
      .api-log-entry__size { color: var(--faint); font-size: 10px; }
      .api-log-view { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; }
      .api-log-pre {
        margin: 0; font-family: var(--font-mono); font-size: 12px; line-height: 1.55;
        color: var(--muted); white-space: pre-wrap; word-break: break-all;
      }
      .api-log-note { color: var(--faint); font-size: 13px; padding: 14px; line-height: 1.6; }
      .api-log-note code { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
      .api-log-empty { border: 1px dashed var(--border); border-radius: var(--radius-md); padding: 14px; margin-top: 10px; color: var(--text); font-size: 13.5px; line-height: 1.6; }
      .api-log-empty strong { display: block; margin-bottom: 4px; }
      .api-log-empty code { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
      .api-log-empty__dir { margin-top: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--faint); }
      .api-log-error { margin-top: 10px; padding: 10px 12px; border-radius: var(--radius-md); background: rgba(255, 107, 107, 0.12); color: #ff6b6b; font-size: 13px; }
      .btn {
        appearance: none;
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
        padding: 8px 18px;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.12s, background 0.15s, opacity 0.15s;
      }
      .btn:active { transform: scale(0.96); }
      .btn--primary {
        background: var(--accent);
        color: #ffffff;
        border: none;
        box-shadow: var(--shadow-sm);
      }
      .btn--primary:hover { background: var(--accent-hover); }
      .btn--ghost {
        background: rgba(0, 0, 0, 0.05);
        border: none;
        color: var(--text);
      }
      [data-color-scheme="dark"] .btn--ghost { background: rgba(255, 255, 255, 0.09); }
      .btn--ghost:hover { background: var(--accent-soft); color: var(--accent); }
      .btn--danger {
        background: rgba(255, 69, 58, 0.12);
        border: none;
        color: var(--rose);
      }
      .btn--danger:hover { background: rgba(255, 69, 58, 0.2); }
      .btn[disabled] { opacity: 0.4; cursor: not-allowed; }

      /* Trajectory governance */
      .gov-dialog {
        max-width: 880px;
        width: 94%;
        max-height: 88vh;
        display: flex;
        flex-direction: column;
        padding: 22px 24px 20px;
      }
      .gov-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
      .gov-header__sub { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 2px; }
      .gov-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
      .gov-stat {
        flex: 1; min-width: 96px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: rgba(255, 255, 255, 0.5);
        padding: 10px 12px;
        display: flex; flex-direction: column; gap: 2px;
      }
      [data-color-scheme="dark"] .gov-stat { background: rgba(255, 255, 255, 0.05); }
      .gov-stat__value { font-family: var(--font-mono); font-size: 20px; font-weight: 700; color: var(--text); }
      .gov-stat__value--accent { color: var(--rose); }
      .gov-stat__label { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
      .gov-tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
      .gov-tab {
        display: inline-flex; align-items: center; gap: 6px;
        font-family: var(--font-sans); font-size: 13px; font-weight: 600;
        color: var(--muted); background: none; border: none; cursor: pointer;
        padding: 8px 12px; border-radius: var(--radius-md) var(--radius-md) 0 0;
        border-bottom: 2px solid transparent;
      }
      .gov-tab:hover { color: var(--text); }
      .gov-tab--active { color: var(--accent); border-bottom-color: var(--accent); }
      .gov-tab__count {
        font-family: var(--font-mono); font-size: 10.5px; color: var(--faint);
        background: var(--accent-soft); padding: 1px 6px; border-radius: 999px;
      }
      .gov-body { flex: 1; min-height: 0; overflow: auto; }
      .gov-empty { color: var(--faint); font-size: 13px; padding: 24px 4px; text-align: center; }
      .gov-tree { font-family: var(--font-mono); font-size: 13px; }
      .gov-node__row {
        display: flex; align-items: center; gap: 7px; width: 100%;
        text-align: left; background: none; border: none; cursor: pointer;
        padding: 4px 8px; border-radius: var(--radius-sm); color: var(--text);
      }
      .gov-node__row:hover { background: var(--accent-softer); }
      .gov-node--turn { font-weight: 700; color: var(--text); }
      .gov-node--tool { color: var(--muted); }
